<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Unofficial redesign concept of the IDOS Connection screen by Artur K. Not affiliated with IDOS or CHAPS.">
<meta name="theme-color" content="#F1F0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IDOS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<title>IDOS Home Concept</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<style>
/* IDOS design system — code tokens.
   Source of truth: Figma "Idos" › Redesign › frame "2" (78:2110). Rules: idos-design-system.md.
   Light values mirror what is on the canvas. Change a value here only after it changed in Figma.
   The dark theme (blocks below :root) is defined in code first and has not been drawn in Figma yet. */

:root {
  color-scheme: light;

  /* ── Primitives ─────────────────────────────────────────── */
  --neutral-0: #FFFFFF;
  --neutral-100: #F1F0F6;
  --neutral-150: #E6E6F0;
  --neutral-200: #DBDBDB;
  --neutral-500: #858585;
  --neutral-600: #6B6B6B;
  --neutral-1000: #141414;
  --brand-500: #0171BB;
  --brand-600: #015F9E;
  --green-700: #0A7D0C;
  --red-600: #D00E15;
  --red-500: #E31E25;
  --blue-600: #0000FF;
  --purple-600: #800080;
  --green-600: #009847;
  --yellow-500: #FDC500;

  /* ── Semantic: colour ───────────────────────────────────── */
  --bg-canvas: var(--neutral-100);          /* screen background */
  --bg-surface: var(--neutral-0);           /* chips, search panel, swap button */
  --text-primary: var(--neutral-1000);
  --text-secondary: var(--neutral-600);     /* 5.33:1 on white, 4.70:1 on canvas: passes AA */
  --text-inverse: var(--neutral-0);          /* text on a --text-primary surface (the toast) */
  --on-action: var(--neutral-0);             /* text on --action-primary: white in both themes */
  --text-brand: var(--brand-500);
  --icon-primary: var(--neutral-1000);
  --icon-secondary: var(--neutral-500);     /* 3.69:1 on white, 3.26:1 on canvas: passes the 3:1 for icons */
  --border-subtle: var(--neutral-150);      /* dividers inside a surface */
  --border-default: var(--neutral-200);     /* rules on the canvas, dot separators */
  --border-strong: var(--neutral-1000);     /* active segmented-tab underline */
  --action-primary: var(--brand-500);
  --action-primary-pressed: var(--brand-600);
  --amenity: var(--green-700);              /* platform marker + letter */
  --status-ok: var(--green-700);            /* "on time" text and its dot, 5.33:1 on white; the only status colour */
  --bg-scrim: rgb(20 20 20 / 0.4);          /* behind a bottom sheet */

  /* Line colours: identity of the route, never status */
  --line-tram: var(--red-600);
  --line-bus: var(--blue-600);
  --line-bus-x: var(--purple-600);
  --line-train-red: var(--red-600);
  --line-train-green: var(--green-600);
  --line-metro-a: var(--green-600);
  --line-metro-b: var(--yellow-500);
  --line-metro-c: var(--red-500);
  --line-trol: var(--green-600);
  --on-line: var(--neutral-0);
  --on-line-metro-b: var(--neutral-1000);   /* the only dark-on-colour badge */

  /* ── Typography ─────────────────────────────────────────── */
  --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* ── Spacing (2px steps below 12, 4px steps above) ──────── */
  --space-2: 2px;
  --space-4: 4px;
  --space-6: 6px;
  --space-8: 8px;
  --space-10: 10px;
  --space-12: 12px;
  --space-16: 16px;
  --space-20: 20px;
  --space-24: 24px;
  --space-32: 32px;
  --space-40: 40px;

  /* ── Layout ─────────────────────────────────────────────── */
  --margin-content: var(--space-32);        /* lists, segmented tabs, tab bar */
  --margin-panel: var(--space-16);          /* docked search panel */
  --gap-section: var(--space-20);           /* between route cards; panel → tab bar */

  /* ── Radius ─────────────────────────────────────────────── */
  --radius-sm: 4px;                         /* chips, panels: the only visible radius */
  --radius-full: 999px;                     /* swap button, dots */

  /* ── Size ───────────────────────────────────────────────── */
  --icon-xs: 12px;
  --icon-sm: 16px;
  --icon-md: 20px;
  --icon-lg: 24px;
  --tap-min: 44px;
  --row-field: 56px;
  --row-control: 48px;
}

/* ── Dark theme: semantic tokens only. Chosen with the theme switch (data-theme) or, if never chosen, the system setting.
   The two blocks must stay identical. ─────────────────────────────── */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-canvas: #141414;
  --bg-surface: #1F1F1F;
  --text-primary: #FFFFFF;                  /* 16.5:1 on surface */
  --text-secondary: #9A9A9A;                /* 5.9:1 on surface, 6.6:1 on canvas */
  --text-inverse: #141414;
  --text-brand: #4DA6E8;                    /* 6.2:1 on surface; the light brand (#0171BB) is only 3.2:1 here */
  --icon-primary: #FFFFFF;
  --icon-secondary: #8A8A8A;                /* 4.8:1 on surface */
  --border-subtle: #141414;                /* = canvas: a divider inside a surface is a gap showing the background, as in light */
  --border-default: #3D3D3D;
  --border-strong: #FFFFFF;
  --amenity: #4CC84F;                       /* platform marker + letter, 7.6:1 on surface */
  --status-ok: #4CC84F;
  --bg-scrim: rgb(0 0 0 / 0.6);
  /* action-primary (#0171BB), its pressed state, line colours and --on-line stay as in light: white text on them passes, and line colours are identity */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg-canvas: #141414;
    --bg-surface: #1F1F1F;
    --text-primary: #FFFFFF;                  /* 16.5:1 on surface */
    --text-secondary: #9A9A9A;                /* 5.9:1 on surface, 6.6:1 on canvas */
    --text-inverse: #141414;
    --text-brand: #4DA6E8;                    /* 6.2:1 on surface; the light brand (#0171BB) is only 3.2:1 here */
    --icon-primary: #FFFFFF;
    --icon-secondary: #8A8A8A;                /* 4.8:1 on surface */
    --border-subtle: #141414;                /* = canvas: a divider inside a surface is a gap showing the background, as in light */
    --border-default: #3D3D3D;
    --border-strong: #FFFFFF;
    --amenity: #4CC84F;                       /* platform marker + letter, 7.6:1 on surface */
    --status-ok: #4CC84F;
    --bg-scrim: rgb(0 0 0 / 0.6);
    /* action-primary (#0171BB), its pressed state, line colours and --on-line stay as in light: white text on them passes, and line colours are identity */
  }
}

/* ── Type roles: use these, never raw font settings ──────── */
.t-segment        { font: 500 20px/24px var(--font-ui); letter-spacing: -0.5px; }
.t-segment-active { font: 600 20px/24px var(--font-ui); letter-spacing: -0.5px; }
.t-field          { font: 500 18px/24px var(--font-ui); letter-spacing: -0.5px; }
.t-time-active    { font: 600 16px/22px var(--font-ui); letter-spacing: -0.5px; }
.t-time           { font: 500 14px/22px var(--font-ui); letter-spacing: -0.25px; }
.t-code           { font: 700 14px/20px var(--font-ui); letter-spacing: 0; }
.t-button         { font: 700 14px/20px var(--font-ui); letter-spacing: 0; text-transform: uppercase; }
.t-option         { font: 600 12px/18px var(--font-ui); letter-spacing: 0; text-transform: uppercase; }
.t-link           { font: 700 12px/18px var(--font-ui); letter-spacing: 0; text-transform: uppercase; }
.t-nav            { font: 700 12px/20px var(--font-ui); letter-spacing: 0; text-transform: uppercase; }
.t-place-strong   { font: 600 14px/20px var(--font-ui); letter-spacing: 0; }
.t-row            { font: 500 18px/24px var(--font-ui); letter-spacing: -0.5px; }
.t-row-meta       { font: 500 14px/20px var(--font-ui); letter-spacing: 0; }
.t-stop           { font: 500 16px/22px var(--font-ui); letter-spacing: -0.25px; }


/* Prototype chrome only (device frame, system bars). Not part of the design system. */
:root { --proto-backdrop: #E3E2EA; --proto-ring: rgb(20 20 20 / 0.08); --proto-shadow: rgb(20 20 20 / 0.35); --proto-indicator: rgb(0 0 0 / 0.35); }
:root[data-theme="dark"] { --proto-backdrop: #0A0A0A; --proto-ring: rgb(255 255 255 / 0.1); --proto-shadow: rgb(0 0 0 / 0.7); --proto-indicator: rgb(255 255 255 / 0.5); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --proto-backdrop: #0A0A0A; --proto-ring: rgb(255 255 255 / 0.1); --proto-shadow: rgb(0 0 0 / 0.7); --proto-indicator: rgb(255 255 255 / 0.5); } }

html, body { height: 100%; overscroll-behavior: none; }
body { background: var(--proto-backdrop); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.device { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: none; }
:root.kbd :is(button, a, [tabindex]):focus-visible { outline: 2px solid var(--action-primary); outline-offset: 2px; }
p { margin: 0; }
.ico { display: block; flex: none; }

.stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-16); padding-block: 32px; padding-inline: 16px; }
.device {
  position: relative; width: 393px; height: 852px; overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--bg-canvas); color: var(--text-primary);
  border-radius: 52px;
  box-shadow: 0 0 0 1px var(--proto-ring), 0 40px 80px -32px var(--proto-shadow);
  font-family: var(--font-ui);
}
@media (max-width: 520px) {
  body { background: var(--bg-canvas); }
  /* a real height (not min-height), otherwise the device's height:100% has nothing to resolve against
     and the screen shrinks to its content instead of filling a tall phone */
  .stage { padding: 0; gap: 0; height: 100%; min-height: 0; }
  .device { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
  .sys { display: none !important; }
}

/* system status bar + home indicator: drawn on desktop only, the phone has real ones */
/* The official IDOS status bar (Figma file Idos, page Status Bars and Menu Bars, "Status bar - iPhone", 16 / 16 Plus: 402 x 59).
   16 px side margins, the time centred in a 116.5 px left zone, the levels centred in a 116.5 px right zone, a 125 x 37 Dynamic Island between. */
.statusbar { position: relative; flex: none; height: 59px; }
.statusbar .island { position: absolute; left: 50%; top: 11px; width: 125px; height: 37px; margin-left: -62.5px; border-radius: 100px; background: #000; }
/* the time is in San Francisco wherever the device has it (iPhone, Mac); Geist is the nearest stand-in elsewhere */
.statusbar .time { position: absolute; left: 16px; top: 18.5px; width: 116.5px; height: 22px; padding-top: 2px; display: flex; justify-content: center; font: 590 17px/22px -apple-system, "SF Pro Text", "SF Pro", Geist, system-ui, sans-serif; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.statusbar .levels { position: absolute; right: 16px; top: 18.5px; width: 116.5px; height: 22px; padding-top: 1px; display: flex; justify-content: center; align-items: center; gap: 7px; }
.statusbar .levels svg { display: block; }
.home-zone { flex: none; height: 42px; display: flex; justify-content: center; padding-top: 30px; }
.home-zone span { width: 140px; height: 5px; border-radius: var(--radius-full); background: var(--proto-indicator); }
@media (max-width: 520px) { .home-zone { height: var(--space-8); padding: 0; } .home-zone span { display: none; } }

.main { --ease-page: cubic-bezier(0.3, 0.6, 0.35, 1); position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ── segmented tabs ───────────────────────────────── */
.segments { position: relative; flex: none; display: flex; gap: var(--space-16); margin: 17px var(--margin-content) 0; height: 44px; }
.segment { display: grid; justify-items: start; padding-bottom: var(--space-20); color: var(--text-secondary); transition: color 0.25s ease; }
.segment > span { grid-area: 1 / 1; }
/* invisible copy in the active weight: the button is always as wide as its bold label, so the active weight changes nothing around it */
.segment::after { content: attr(data-label); grid-area: 1 / 1; font: 600 20px/24px var(--font-ui); letter-spacing: -0.5px; height: 0; overflow: hidden; visibility: hidden; }
.segment[aria-selected="true"] { color: var(--text-primary); }
/* One underline bar that slides with the pages; the script writes its x and width (scaleX of a 1px bar). */
.indicator { position: absolute; left: 0; bottom: 0; width: 1px; height: 2px; background: var(--border-strong); transform-origin: 0 0; will-change: transform; transition: transform 0.42s var(--ease-page); }

/* ── tab pages ────────────────────────────────────── */
/* Favorites and Recent sit side by side on one track. A swipe drags the track; letting go only finishes the
   movement in the direction the finger was already going, so it is one continuous motion. */
.rule { flex: none; height: 1px; margin: 0 var(--margin-content); background: var(--border-default); }
/* The glide starts at about the speed of a flicking finger (initial slope 2) and only then eases out, so letting
   go does not make the page jump ahead. A steeper curve like (0.22, 1, 0.36, 1) starts 3x faster than the finger. */
.pager { flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; }
.track { display: flex; height: 100%; will-change: transform; transition: transform 0.42s var(--ease-page); }
.main.is-dragging :is(.track, .indicator) { transition: none; }
.pane { flex: none; width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; touch-action: pan-y; }
.pane::-webkit-scrollbar { display: none; }
.cards { display: flex; flex-direction: column; gap: var(--gap-section); padding-top: var(--gap-section); }
.view-all { display: block; margin: 0 var(--margin-content); padding: var(--space-8) 0; color: var(--text-secondary); }

.card { display: flex; flex-direction: column; gap: var(--space-10); padding-bottom: var(--space-8); }
.card[hidden] { display: none; }
.card-head { display: flex; align-items: center; gap: var(--space-4); width: calc(100% - 2 * var(--margin-content)); margin: 0 var(--margin-content); min-width: 0; min-height: 20px; }
.card-head .names { display: flex; align-items: center; gap: var(--space-8); min-width: 0; }
.card-head .from { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head .to { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot3 { flex: none; width: 3px; height: 3px; border-radius: var(--radius-full); background: var(--icon-secondary); }
.card-head .ico { color: var(--icon-secondary); }

/* Two chips fill the row exactly, so the row never scrolls and a horizontal swipe is free to switch tabs.
   Spacing between chips is a margin, not a gap, so a leaving chip can collapse to nothing. */
.chips { display: flex; overflow: hidden; padding-left: var(--margin-content); }
/* end spacer: last chip's 8px margin + 24px = the 32px margin on the right */
.chips::after { content: ""; flex: none; width: var(--space-24); }

/* Horizontal drags belong to the tab swipe; vertical ones still scroll the page. */
.chips { touch-action: pan-y; }

/* Chip width follows the screen so two chips always fill the 32px margins:
   393 → 160.5 (Figma 160), 428 (iPhone 13 Pro Max) → 178, 375 → 151.5. */
.device { container-type: inline-size; }
.chip {
  flex: none; display: flex; width: 160px; height: 60px; margin-right: var(--space-8);
  background: var(--bg-surface); border-radius: var(--radius-sm); overflow: hidden;
  transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), margin-right 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
}
@supports (width: 1cqw) { .chip { width: clamp(140px, calc((100cqw - 72px) / 2), 240px); } }
.chip.is-entering, .chip.is-leaving { width: 0; margin-right: 0; opacity: 0; }
.chip.is-leaving { pointer-events: none; }

/* "now" blinks over the hold, then the chip leaves. --blink (one cycle) and --blinks (count) are set from the script. */
.when.is-now { animation: now-blink var(--blink, 650ms) ease-in-out var(--blinks, 4); }
@keyframes now-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.badge { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-4); width: 48px; color: var(--on-line); }
.badge .glyphs { display: flex; align-items: center; }
:is(.badge, .line-tag)[data-line="tram"] { background: var(--line-tram); }
:is(.badge, .line-tag)[data-line="bus"] { background: var(--line-bus); }
:is(.badge, .line-tag)[data-line="bus-x"] { background: var(--line-bus-x); }
:is(.badge, .line-tag)[data-line="train-red"] { background: var(--line-train-red); }
:is(.badge, .line-tag)[data-line="train-green"] { background: var(--line-train-green); }
:is(.badge, .line-tag)[data-line="metro-a"] { background: var(--line-metro-a); }
:is(.badge, .line-tag)[data-line="metro-b"] { background: var(--line-metro-b); color: var(--on-line-metro-b); }
:is(.badge, .line-tag)[data-line="metro-c"] { background: var(--line-metro-c); }
:is(.badge, .line-tag)[data-line="trol"] { background: var(--line-trol); }

.chip-info { display: flex; flex-direction: column; justify-content: center; gap: var(--space-4); min-width: 0; padding: 0 var(--space-16) var(--space-4) var(--space-10); }
.chip-info .when { white-space: nowrap; font-variant-numeric: tabular-nums; }
.amenities { display: flex; align-items: center; gap: var(--space-6); color: var(--icon-secondary); }
.platform { display: flex; align-items: center; gap: var(--space-4); color: var(--amenity); }

/* ── search panel ─────────────────────────────────── */
.panel { position: relative; flex: none; margin: var(--space-8) var(--margin-panel) 0; background: var(--bg-surface); border-radius: var(--radius-sm); }
.field { display: flex; align-items: center; gap: var(--space-8); width: 100%; height: var(--row-field); padding: 0 var(--space-16); color: var(--icon-secondary); cursor: text; }
.field + .field { border-top: 1px solid var(--border-subtle); }
/* a real text input: Figma draws the value in text-secondary, it turns primary while being edited */
.field .value {
  flex: 1; min-width: 0; height: 100%; margin: 0; padding: 0; border: 0; border-radius: 0; outline: 0; background: none;
  -webkit-appearance: none; appearance: none; text-overflow: ellipsis;
  color: var(--text-secondary); caret-color: var(--action-primary);
  -webkit-user-select: text; user-select: text;   /* the device frame disables selection; an input must not inherit that */
}
.field .value::placeholder { color: var(--text-secondary); opacity: 1; }
.field:focus-within .value { color: var(--text-primary); }
.swap {
  position: absolute; top: 36px; right: 38px; width: 40px; height: 40px; border-radius: var(--radius-full);   /* 10px closer to the edge than before: a long stop name no longer reaches it, and 16px would run into the map icon */
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--border-subtle); color: var(--icon-secondary);
}
.swap .ico { transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
.swap.is-flipped .ico { transform: rotate(180deg); }
.options { display: flex; align-items: center; justify-content: space-between; height: var(--row-control); padding: 0 var(--space-16); border-top: 1px solid var(--border-subtle); }
.option { display: flex; align-items: center; gap: var(--space-8); min-height: var(--tap-min); color: var(--icon-secondary); }
.option .label { color: var(--text-primary); }
.option--icon { justify-content: center; min-width: var(--tap-min); margin-right: calc(-1 * var(--space-12)); }
.sep { flex: none; width: 4px; height: 4px; border-radius: var(--radius-full); background: var(--border-default); }
.cta { display: flex; align-items: center; justify-content: center; width: 100%; height: var(--row-control); background: var(--action-primary); color: var(--on-action); border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
.cta:active { background: var(--action-primary-pressed); }

/* ── tab bar ──────────────────────────────────────── */
.tabbar { flex: none; display: flex; height: 56px; margin: var(--gap-section) var(--margin-content) 0; overflow: hidden; transition: height 0.4s cubic-bezier(0.3, 0.6, 0.35, 1), margin-top 0.4s cubic-bezier(0.3, 0.6, 0.35, 1), opacity 0.25s ease; }
/* second-order pages (search results, one trip) have no tab bar: it folds away as the page slides in, and the page takes its room */
.device.is-deep .tabbar { height: 0; margin-top: 0; opacity: 0; }
/* Tab item, State = Default | Active (Figma set 61:1161) */
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); padding-top: var(--space-2); }
.tab .frame { position: relative; width: 32px; height: 32px; }
.tab .frame .ico { position: absolute; left: 50%; top: 50%; transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
.tab .ic-default { color: var(--icon-secondary); transform: translate(-50%, -50%) scale(1); }
.tab .ic-active { color: var(--text-brand); opacity: 0; transform: translate(-50%, -50%) scale(0.75); }
.tab[aria-current="page"] .ic-default { opacity: 0; transform: translate(-50%, -50%) scale(1.33); }
.tab[aria-current="page"] .ic-active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.tab .t-nav { color: var(--text-secondary); transition: color 0.2s ease; }
.tab[aria-current="page"] .t-nav { color: var(--text-brand); }

/* ── More: a plain list of destinations ───────────── */
/* Same frame as Connection: a 20px title where the tabs sit, the 1px rule, then white groups on the canvas.
   Rows are separated inside a group by border-subtle, groups by the 20px section gap. */
.more { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg-canvas); }
.more[hidden] { display: none; }
.more-title { flex: none; height: 24px; margin: 17px var(--margin-content) 0; }

/* ── Compare: a before/after slider whose handle rests on the right edge ───────── */
.cmp-overlay { --pos: 100%; position: absolute; inset: 0; z-index: 60; pointer-events: none; }

.cmp-tag-before { left: calc(var(--pos) + 28px); }          /* right of the handle */

.cmp-hint { position: absolute; z-index: 2; width: 240px; padding: var(--space-12) var(--space-16); border-radius: var(--radius-sm); background: var(--text-primary); color: var(--text-inverse); pointer-events: none; }
.cmp-hint[hidden] { display: none; }
.cmp-overlay.dark-shot .cmp-orig { background: #000; }   /* the dark original: its tab bar colour */
.cmp-orig .none { position: absolute; right: var(--margin-content); top: 40%; width: 200px; color: var(--text-secondary); }
.cmp-handle { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 44px; margin-left: -22px; pointer-events: none; touch-action: none; cursor: ew-resize; display: flex; justify-content: center; }

.cmp-overlay.is-open .cmp-line { opacity: 1; }

.cmp-grip { position: absolute; top: calc(42% + 6px); left: 0; width: 44px; height: 44px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-full); background: var(--text-primary); color: var(--text-inverse); outline: 1px solid var(--bg-canvas); pointer-events: auto; transition: transform 0.25s var(--ease-page), background-color 0.2s ease; }

.cmp-grip::before { content: ""; position: absolute; inset: -10px -4px -10px -14px; }   /* the tap target is 62 x 64 */

.cmp-overlay.is-open .cmp-grip { background: var(--action-primary); color: var(--on-action); }

  // ══ Search results ════════════════════════════════════════════════════════════════════════════════════
  // Search lists whole connections, soonest first; a result opens its trip. A pair that matches a saved route uses
  // that route's real trips, any other pair gets plausible generated ones (concept data, deterministic per pair).
  var DPP_WHO = "Dopravní podnik hl.m. Prahy, a.s.; Praha 9; 296 191 817 (296 197 150)";
  var HUBS = ["Můstek", "Florenc", "Anděl", "Muzeum", "Karlovo náměstí", "Dejvická", "Hlavní nádraží", "Náměstí Republiky"];
  var VIA = ["Náměstí Míru", "Jiřího z Poděbrad", "Flora", "Želivského", "Hradčanská", "Malostranská", "Staroměstská", "Vltavská", "Palmovka", "Invalidovna", "Karlovo náměstí", "Újezd", "Ořechovka", "Bořislavka"];
  var ENDS = ["Černý Most", "Zličín", "Letňany", "Depo Hostivař", "Sídliště Barrandov", "Lehovec", "Kobylisy"];
  var TRAMS = ["9", "22", "24", "26", "6", "17"], BUSES = ["119", "133", "207", "136", "175"];

  function hash(s) { var n = 7; for (var i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) | 0; return Math.abs(n); }
  function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
  function fits(saved, typed) { return typed.length >= 3 && (saved.indexOf(typed) >= 0 || typed.indexOf(saved) >= 0); }
  function matchRoute(a, b) {
    var na = norm(a), nb = norm(b), found = null;
    FAVORITES.concat(RECENT).forEach(function (r) {
      if (!found && TRIPS[r.id + ":0"] && fits(norm(r.from), na) && fits(norm(r.to), nb)) found = r;
    });
    return found;
  }
  function stopOf(n, p, a) { return { n: n, p: p, a: !!a }; }
  function viaList(n, seed) { var out = []; for (var i = 0; i < n; i++) out.push(VIA[(seed + i * 3) % VIA.length]); return out; }

  function genTrip(a, b, k) {
    var v = hash(norm(a) + ">" + norm(b)) + k * 7, kind = ["tram", "bus", "metro+tram", "bus", "metro+bus"][v % 5], plat = "ABCD".charAt((v >> 1) % 4), legs;
    if (kind.indexOf("+") < 0) {
      var dd = 12 + v % 24, isTram = kind === "tram";
      legs = [{ line: isTram ? "tram" : "bus", code: isTram ? TRAMS[v % TRAMS.length] : BUSES[v % BUSES.length], dir: ENDS[(v >> 2) % ENDS.length], dep: 0, arr: dd,
        status: v % 3 ? "on" : "usual", low: v % 4 !== 0, from: stopOf(a, plat, true), to: stopOf(b, "ABCD".charAt((v >> 3) % 4), true), via: viaList(1 + v % 4, v) }];
    } else {
      var hub = HUBS[(v >> 2) % HUBS.length];
      if (norm(hub) === norm(a) || norm(hub) === norm(b)) hub = HUBS[((v >> 2) + 1) % HUBS.length];
      var m = v % 3, d1 = 8 + v % 11, walk = 2 + v % 3, d2 = 7 + (v >> 3) % 12, tram = kind === "metro+tram";
      legs = [
        { line: "metro-" + "abc".charAt(m), code: "ABC".charAt(m), dir: ENDS[v % ENDS.length], dep: 0, arr: d1, status: "on", low: true,
          from: stopOf(a, "1", true), to: stopOf(hub, "2", true), via: viaList(1 + v % 3, v) },
        { line: tram ? "tram" : "bus", code: tram ? TRAMS[(v >> 1) % TRAMS.length] : BUSES[(v >> 1) % BUSES.length], dir: ENDS[(v >> 4) % ENDS.length], walk: walk,
          dep: d1 + walk, arr: d1 + walk + d2, status: "usual", low: v % 2 === 0, from: stopOf(hub, plat, true), to: stopOf(b, "ABCD".charAt((v >> 3) % 4), true), via: viaList(1 + (v >> 2) % 3, v + 5) }
      ];
    }
    var total = legs[legs.length - 1].arr;
    return {
      km: Math.max(2, Math.round(total * 0.5)), legs: legs, restrictions: [],
      carriers: [{ who: DPP_WHO, lines: legs.map(function (l) { return MODE[l.line] + " " + l.code; }).join(", ") }],
      fare: { section: a + " - " + b, tariff: "long-term local ticket - zone P / in application",
        price: total <= 30 ? "30,-CZK / 27,-CZK (30 min)" : total <= 90 ? "40,-CZK / 36,-CZK (90 min)" : "60,-CZK / 54,-CZK (90 min)" }
    };
  }

  // Next `n` results for the open search.
  function growResults(n) {
    for (var i = 0; i < n; i++) {
      var k = res.items.length, item;

      } else {
        res.lastT = res.lastT == null ? clock + 2 + hash(res.a + res.b) % 4 : res.lastT + 6 + hash(res.a + res.b + k) % 6;
        item = { data: genTrip(res.a, res.b, k), t: res.lastT, day: 621, routeId: null, key: "s:" + hash(res.a + res.b) + ":" + k + ":" + res.lastT, n: k };

  function tagHtml(l) {

      '<span class="line">' + icon("regular:sign-out", 20) + '<span class="name">' + esc(res.b) + "</span></span></h1>";

  }

  // Countdowns stay in step with the chips; a departure that has left drops off the list.
  function updateResults(force) {
    if (!res) return;

    if (res.items.length < 3 && !res.done) { var before = res.items.length; growResults(3); if (res.items.length === before) res.done = true; changed = true; }
    if (changed && !force) { renderResults(); return; }
    var els = resultsScroll.querySelectorAll(".result");
    for (var i = 0; i < els.length; i++) {
      var it = res.items[+els[i].getAttribute("data-i")];
      if (!it) continue;
      var min = it.t - clock, w = els[i].querySelector(".when"), text = min <= 0 ? "now" : "in " + min + " min", cls = "when t-time-active" + (min === 0 ? " is-now" : "");
      if (w.textContent !== text) w.textContent = text;

  function setStar(on) {

  function openResults(a, b, fromEl) {

    var route = matchRoute(a, b), slots = [];
    if (route) {

  }

  document.getElementById("resBack").addEventListener("click", closeResults);

  // ══ Appearance ════════════════════════════════════════════════════════════════════════════════════════
  // One switch in More. Until it is used the theme follows the system; from then on the choice is kept in localStorage.

  // ══ Compare with the original ═════════════════════════════════════════════════════════════════════════
  // A before/after slider that is always there: its handle rests on the right edge of the screen. Drag it left and the original
  // IDOS screen (a screenshot) appears from the right edge up to the handle, the working prototype stays on the left. Let go near
  // the edge, or tap the handle, and it goes back. It only exists if the screenshots are next to this page (the single-file artifact
  // copy has none) and never with ?fab=off.
  (function () {
    var overlay = document.getElementById("cmpOverlay"), orig = document.getElementById("cmpOrig"), handle = document.getElementById("cmpHandle");
    var SHOT = { connection: "Connection", results: "Search results", trip: "Trip", "trip-end": "Restrictions, carriers and fare", more: "More", tickets: "Tickets" };
    // the same picture in three widths: the browser takes the one that matches the screen, so small text is never shrunk 3x on the fly
    var FULLW = { connection: 1183, results: 1183, trip: 1183, tickets: 1183, "dark-connection": 1183, "dark-results": 1183, "dark-trip": 1183, "dark-more": 1183, "dark-tickets": 1183 };

    }

    probe.onload = function () {
      overlay.hidden = false;
      Object.keys(SHOT).concat(Object.keys(HAVE_DARK).map(function (k) { return "dark-" + k; })).forEach(function (k) { var im = new Image(); im.sizes = "(max-width: 520px) 100vw, 393px"; im.srcset = "compare/before-" + k + "-393.webp 393w, compare/before-" + k + "-590.webp 590w, compare/before-" + k + "-786.webp 786w, compare/before-" + k + ".webp " + (FULLW[k] || 1284) + "w"; im.src = "compare/before-" + k + ".webp"; });   // ready before the first pull
    };
    probe.src = "compare/before-connection-393.webp";   // the small one: loading the full picture here would make the browser reuse it everywhere

    function screenNow() {

    }

      shown = key;
      overlay.classList.toggle("dark-shot", dark);
      orig.innerHTML = s ? '<img ' + picAttrs(key) + ' alt="Original IDOS app' + (dark ? ", dark theme" : "") + ': ' + SHOT[s] + '" width="1284" height="2778" decoding="async" draggable="false">'
        : '<p class="none t-row">The original app has no screen like this one.</p>';
    }
    function set(v) {
      rev = Math.max(0, Math.min(100, v));

      overlay.classList.toggle("is-full", rev >= 100);
      overlay.classList.toggle("show-before", rev >= 26 && rev < 100);   // a tag needs about 100px beside the handle

      handle.setAttribute("aria-valuetext", rev >= 100 ? "Original only" : open ? Math.round(rev) + " percent original" : "Original hidden");

      else { orig.innerHTML = ""; shown = ""; }
    }
    function at(e) { var r = overlay.getBoundingClientRect(); return (r.right - e.clientX) / r.width * 100; }
    // On release the handle finishes the move by itself: to the side it was pulled towards. A quick flick decides by its direction,

      var dur = 250 + 220 * Math.abs(dist) / 100;                          // 250 to 470 ms: between the quick first version (180-340) and the slow one (340-600)
      var m0 = Math.min(Math.max(0, (v0 || 0) * dir) * dur, 1.1 * Math.abs(dist)) * dir;   // carry the finger's speed in, only towards the target, never a lunge
      overlay.classList.add("is-dragging");                                // no CSS transitions while the script drives it
      (function step(now) {
        var p = Math.min(1, (now - start) / dur), p2 = p * p, p3 = p2 * p;
        set((2 * p3 - 3 * p2 + 1) * from + (p3 - 2 * p2 + p) * m0 + (-2 * p3 + 3 * p2) * target);   // cubic Hermite: starts at the finger's speed, ends at rest
        if (p < 1) glideFrame = requestAnimationFrame(step); else { set(target); overlay.classList.remove("is-dragging"); }
      })(start);
    }
    function velocity() {   // percent per millisecond over the last ~90 ms, + means towards the original
      var last = samples[samples.length - 1], i = samples.length - 2;   // at least the previous sample, then back while within ~90 ms
      while (i > 0 && last.t - samples[i - 1].t < 90) i--;
      var first = samples[i];
      return last.t === first.t ? 0 : (last.v - first.v) / (last.t - first.t);
    }
    // the picture is only a picture of the original app: say so where the finger is
    var hint = document.getElementById("cmpHint"), hintTimer = 0;
    function hideHint() { clearTimeout(hintTimer); hint.hidden = true; }
    orig.addEventListener("click", function (e) {
      var r = overlay.getBoundingClientRect();
      hint.textContent = "This is a screenshot of the original IDOS app, the Before version. It is not interactive.";
      hint.hidden = false;
      var x = e.clientX - r.left - 120, y = e.clientY - r.top - hint.offsetHeight - 20;
      hint.style.left = Math.max(16, Math.min(r.width - 256, x)) + "px";
      hint.style.top = Math.max(16, Math.min(r.height - hint.offsetHeight - 16, y)) + "px";
      clearTimeout(hintTimer);
      hintTimer = setTimeout(hideHint, 3200);
    });
    handle.addEventListener("pointerdown", function (e) { stopGlide(); dragging = true; moved = false; samples = []; handle.setPointerCapture(e.pointerId); });
    handle.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var v = at(e);
      v = Math.max(0, Math.min(100, (v - 7) * 100 / 86));   // a finger cannot touch the very edge of the glass: its 7%..93% span carries the handle over 0..100, with no jump
      if (!moved && Math.abs(v - rev) < 2) return;    // a tap is not a drag
      moved = true; overlay.classList.add("is-dragging"); set(v);
      samples.push({ t: performance.now(), v: rev }); if (samples.length > 8) samples.shift();
    });
    function end() {
      if (!dragging) return;
      dragging = false; overlay.classList.remove("is-dragging");
      if (!moved) { glide(rev > 0 ? 0 : 100, 0); return; }                     // a tap: all the way in, or all the way out
      var vel = samples.length > 1 ? velocity() : 0;
      glide(Math.abs(vel) > 0.04 ? (vel > 0 ? 100 : 0) : (rev >= 50 ? 100 : 0), vel);
    }
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
    handle.addEventListener("keydown", function (e) {
      var step = e.shiftKey ? 25 : 5;
      if (e.key === "ArrowLeft") { set(rev + step); e.preventDefault(); }
      else if (e.key === "ArrowRight") { set(rev - step); e.preventDefault(); }
      else if (e.key === "Home") { set(100); e.preventDefault(); }
      else if (e.key === "End" || e.key === "Escape") { set(0); e.preventDefault(); }
    });
  })();


})();
</script>
