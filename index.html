<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Unofficial redesign concept of the IDOS Connection screen by Artur K. Not affiliated with IDOS or CHAPS.">
<meta name="theme-color" content="#F1F0F6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IDOS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<title>IDOS Home Concept</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<style>
/* IDOS design system — code tokens.
   Source of truth: Figma "Idos" › Redesign › frame "2" (78:2110). Rules: idos-design-system.md.
   Values mirror what is on the canvas. Change a value here only after it changed in Figma. */

:root {
  color-scheme: light;

  /* ── Primitives ─────────────────────────────────────────── */
  --neutral-0: #FFFFFF;
  --neutral-100: #F1F0F6;
  --neutral-150: #E6E6F0;
  --neutral-200: #DBDBDB;
  --neutral-400: #999999;
  --neutral-500: #858585;
  --neutral-1000: #141414;
  --brand-500: #0171BB;
  --brand-600: #015F9E;
  --green-700: #0A7D0C;
  --red-600: #D00E15;
  --red-500: #E31E25;
  --blue-600: #0000FF;
  --purple-600: #800080;
  --green-600: #009847;
  --yellow-500: #FDC500;

  /* ── Semantic: colour ───────────────────────────────────── */
  --bg-canvas: var(--neutral-100);          /* screen background */
  --bg-surface: var(--neutral-0);           /* chips, search panel, swap button */
  --text-primary: var(--neutral-1000);
  --text-secondary: var(--neutral-500);     /* AA fails, see design system §Accessibility */
  --text-inverse: var(--neutral-0);
  --text-brand: var(--brand-500);
  --icon-primary: var(--neutral-1000);
  --icon-secondary: var(--neutral-400);
  --border-subtle: var(--neutral-150);      /* dividers inside a surface */
  --border-default: var(--neutral-200);     /* rules on the canvas, dot separators */
  --border-strong: var(--neutral-1000);     /* active segmented-tab underline */
  --action-primary: var(--brand-500);
  --action-primary-pressed: var(--brand-600);
  --amenity: var(--green-700);              /* platform marker + letter */

  /* Line colours: identity of the route, never status */
  --line-tram: var(--red-600);
  --line-bus: var(--blue-600);
  --line-bus-x: var(--purple-600);
  --line-train-red: var(--red-600);
  --line-train-green: var(--green-600);
  --line-metro-a: var(--green-600);
  --line-metro-b: var(--yellow-500);
  --line-metro-c: var(--red-500);
  --on-line: var(--neutral-0);
  --on-line-metro-b: var(--neutral-1000);   /* the only dark-on-colour badge */

  /* ── Typography ─────────────────────────────────────────── */
  --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* ── Spacing (2px steps below 12, 4px steps above) ──────── */
  --space-2: 2px;
  --space-4: 4px;
  --space-6: 6px;
  --space-8: 8px;
  --space-10: 10px;
  --space-12: 12px;
  --space-16: 16px;
  --space-20: 20px;
  --space-24: 24px;
  --space-32: 32px;
  --space-40: 40px;

  /* ── Layout ─────────────────────────────────────────────── */
  --margin-content: var(--space-32);        /* lists, segmented tabs, tab bar */
  --margin-panel: var(--space-16);          /* docked search panel */
  --gap-section: var(--space-20);           /* between route cards; panel → tab bar */

  /* ── Radius ─────────────────────────────────────────────── */
  --radius-sm: 4px;                         /* chips, panels: the only visible radius */
  --radius-full: 999px;                     /* swap button, dots */

  /* ── Size ───────────────────────────────────────────────── */
  --icon-xs: 12px;
  --icon-sm: 16px;
  --icon-md: 20px;
  --icon-lg: 24px;
  --tap-min: 44px;
  --row-field: 56px;
  --row-control: 48px;
}

/* ── Type roles: use these, never raw font settings ──────── */
.t-segment        { font: 500 20px/24px var(--font-ui); letter-spacing: -0.5px; }
.t-segment-active { font: 600 20px/24px var(--font-ui); letter-spacing: -0.5px; }
.t-field          { font: 500 18px/24px var(--font-ui); letter-spacing: -0.5px; }
.t-time-active    { font: 600 16px/22px var(--font-ui); letter-spacing: -0.5px; }
.t-time           { font: 500 14px/22px var(--font-ui); letter-spacing: -0.25px; }
.t-code           { font: 700 14px/20px var(--font-ui); letter-spacing: 0; }
.t-button         { font: 700 14px/20px var(--font-ui); letter-spacing: 0; text-transform: uppercase; }
.t-option         { font: 600 12px/18px var(--font-ui); letter-spacing: 0; text-transform: uppercase; }
.t-link           { font: 700 12px/18px var(--font-ui); letter-spacing: 0; text-transform: uppercase; }
.t-nav            { font: 700 12px/20px var(--font-ui); letter-spacing: 0; text-transform: uppercase; }
.t-place-strong   { font: 600 14px/20px var(--font-ui); letter-spacing: 0; }


/* Prototype chrome only (device frame, system bars). Not part of the design system. */
:root { --proto-backdrop: #E3E2EA; }

html, body { height: 100%; overscroll-behavior: none; }
body { background: var(--proto-backdrop); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.device { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.disclaimer { font: 500 12px/18px var(--font-ui); color: var(--text-secondary); text-align: center; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--action-primary); outline-offset: 2px; }
p { margin: 0; }
.ico { display: block; flex: none; }

.stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-16); padding-block: 32px; padding-inline: 16px; }
.device {
  position: relative; width: 393px; height: 852px; overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--bg-canvas); color: var(--text-primary);
  border-radius: 52px;
  box-shadow: 0 0 0 1px rgb(20 20 20 / 0.08), 0 40px 80px -32px rgb(20 20 20 / 0.35);
  font-family: var(--font-ui);
}
@media (max-width: 520px) {
  body { background: var(--bg-canvas); }
  /* a real height (not min-height), otherwise the device's height:100% has nothing to resolve against
     and the screen shrinks to its content instead of filling a tall phone */
  .stage { padding: 0; gap: 0; height: 100%; min-height: 0; }
  .device { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
  .sys { display: none !important; }
}

/* system status bar + home indicator: drawn on desktop only, the phone has real ones */
.statusbar { flex: none; height: 59px; display: flex; align-items: center; justify-content: space-between; padding: 11px 32px 11px 48px; }
.statusbar .time { font: 600 17px/22px system-ui, -apple-system, sans-serif; }
.statusbar .levels { display: flex; gap: 6px; align-items: center; }
.home-zone { flex: none; height: 42px; display: flex; justify-content: center; padding-top: 30px; }
.home-zone span { width: 140px; height: 5px; border-radius: var(--radius-full); background: rgb(0 0 0 / 0.35); }
@media (max-width: 520px) { .home-zone { height: var(--space-8); padding: 0; } .home-zone span { display: none; } }

.main { --ease-page: cubic-bezier(0.3, 0.6, 0.35, 1); position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ── segmented tabs ───────────────────────────────── */
.segments { position: relative; flex: none; display: flex; gap: var(--space-16); margin: 17px var(--margin-content) 0; height: 44px; }
.segment { padding-bottom: var(--space-20); color: var(--text-secondary); transition: color 0.25s ease; }
.segment[aria-selected="true"] { color: var(--text-primary); }
/* One underline bar that slides with the pages; the script writes its x and width (scaleX of a 1px bar). */
.indicator { position: absolute; left: 0; bottom: 0; width: 1px; height: 2px; background: var(--border-strong); transform-origin: 0 0; will-change: transform; transition: transform 0.42s var(--ease-page); }

/* ── tab pages ────────────────────────────────────── */
/* Favorites and Recent sit side by side on one track. A swipe drags the track; letting go only finishes the
   movement in the direction the finger was already going, so it is one continuous motion. */
.rule { flex: none; height: 1px; margin: 0 var(--margin-content); background: var(--border-default); }
/* The glide starts at about the speed of a flicking finger (initial slope 2) and only then eases out, so letting
   go does not make the page jump ahead. A steeper curve like (0.22, 1, 0.36, 1) starts 3x faster than the finger. */
.pager { flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; }
.track { display: flex; height: 100%; will-change: transform; transition: transform 0.42s var(--ease-page); }
.main.is-dragging :is(.track, .indicator) { transition: none; }
.pane { flex: none; width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; touch-action: pan-y; }
.pane::-webkit-scrollbar { display: none; }
.cards { display: flex; flex-direction: column; gap: var(--gap-section); padding-top: var(--gap-section); }
.view-all { display: block; margin: 0 var(--margin-content); padding: var(--space-8) 0; color: var(--text-secondary); }

.card { display: flex; flex-direction: column; gap: var(--space-10); padding-bottom: var(--space-8); }
.card[hidden] { display: none; }
.card-head { display: flex; align-items: center; gap: var(--space-4); width: calc(100% - 2 * var(--margin-content)); margin: 0 var(--margin-content); min-width: 0; min-height: 20px; }
.card-head .names { display: flex; align-items: center; gap: var(--space-8); min-width: 0; }
.card-head .from { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head .to { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot3 { flex: none; width: 3px; height: 3px; border-radius: var(--radius-full); background: var(--icon-secondary); }
.card-head .ico { color: var(--icon-secondary); }

/* Two chips fill the row exactly, so the row never scrolls and a horizontal swipe is free to switch tabs.
   Spacing between chips is a margin, not a gap, so a leaving chip can collapse to nothing. */
.chips { display: flex; overflow: hidden; padding-left: var(--margin-content); }
/* end spacer: last chip's 8px margin + 24px = the 32px margin on the right */
.chips::after { content: ""; flex: none; width: var(--space-24); }

/* Horizontal drags belong to the tab swipe; vertical ones still scroll the page. */
.chips { touch-action: pan-y; }

/* Chip width follows the screen so two chips always fill the 32px margins:
   393 → 160.5 (Figma 160), 428 (iPhone 13 Pro Max) → 178, 375 → 151.5. */
.device { container-type: inline-size; }
.chip {
  flex: none; display: flex; width: 160px; height: 60px; margin-right: var(--space-8);
  background: var(--bg-surface); border-radius: var(--radius-sm); overflow: hidden;
  transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), margin-right 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
}
@supports (width: 1cqw) { .chip { width: clamp(140px, calc((100cqw - 72px) / 2), 240px); } }
.chip.is-entering, .chip.is-leaving { width: 0; margin-right: 0; opacity: 0; }
.chip.is-leaving { pointer-events: none; }

/* "now" blinks over the hold, then the chip leaves. --blink (one cycle) and --blinks (count) are set from the script. */
.when.is-now { animation: now-blink var(--blink, 650ms) ease-in-out var(--blinks, 4); }
@keyframes now-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.badge { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-4); width: 48px; color: var(--on-line); }
.badge .glyphs { display: flex; align-items: center; }
.badge[data-line="tram"] { background: var(--line-tram); }
.badge[data-line="bus"] { background: var(--line-bus); }
.badge[data-line="bus-x"] { background: var(--line-bus-x); }
.badge[data-line="train-red"] { background: var(--line-train-red); }
.badge[data-line="train-green"] { background: var(--line-train-green); }
.badge[data-line="metro-a"] { background: var(--line-metro-a); }
.badge[data-line="metro-b"] { background: var(--line-metro-b); color: var(--on-line-metro-b); }
.badge[data-line="metro-c"] { background: var(--line-metro-c); }

.chip-info { display: flex; flex-direction: column; justify-content: center; gap: var(--space-4); min-width: 0; padding: 0 var(--space-16) var(--space-4) var(--space-10); }
.chip-info .when { white-space: nowrap; font-variant-numeric: tabular-nums; }
.amenities { display: flex; align-items: center; gap: var(--space-6); color: var(--icon-secondary); }
.platform { display: flex; align-items: center; gap: var(--space-4); color: var(--amenity); }

/* ── search panel ─────────────────────────────────── */
.panel { position: relative; flex: none; margin: var(--space-8) var(--margin-panel) 0; background: var(--bg-surface); border-radius: var(--radius-sm); }
.field { display: flex; align-items: center; gap: var(--space-8); width: 100%; height: var(--row-field); padding: 0 var(--space-16); color: var(--icon-secondary); cursor: text; }
.field + .field { border-top: 1px solid var(--border-subtle); }
/* a real text input: Figma draws the value in text-secondary, it turns primary while being edited */
.field .value {
  flex: 1; min-width: 0; height: 100%; margin: 0; padding: 0; border: 0; border-radius: 0; outline: 0; background: none;
  -webkit-appearance: none; appearance: none; text-overflow: ellipsis;
  color: var(--text-secondary); caret-color: var(--action-primary);
  -webkit-user-select: text; user-select: text;   /* the device frame disables selection; an input must not inherit that */
}
.field .value::placeholder { color: var(--text-secondary); opacity: 1; }
.field:focus-within .value { color: var(--text-primary); }
.swap {
  position: absolute; top: 36px; right: 48px; width: 40px; height: 40px; border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--border-subtle); color: var(--icon-secondary);
}
.swap .ico { transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
.swap.is-flipped .ico { transform: rotate(180deg); }
.options { display: flex; align-items: center; justify-content: space-between; height: var(--row-control); padding: 0 var(--space-16); border-top: 1px solid var(--border-subtle); }
.option { display: flex; align-items: center; gap: var(--space-8); min-height: var(--tap-min); color: var(--icon-secondary); }
.option .label { color: var(--text-primary); }
.option--icon { justify-content: center; min-width: var(--tap-min); margin-right: calc(-1 * var(--space-12)); }
.sep { flex: none; width: 4px; height: 4px; border-radius: var(--radius-full); background: var(--border-default); }
.cta { display: flex; align-items: center; justify-content: center; width: 100%; height: var(--row-control); background: var(--action-primary); color: var(--text-inverse); border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
.cta:active { background: var(--action-primary-pressed); }

/* ── tab bar ──────────────────────────────────────── */
.tabbar { flex: none; display: flex; height: 56px; margin: var(--gap-section) var(--margin-content) 0; }
/* Tab item, State = Default | Active (Figma set 61:1161) */
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); padding-top: var(--space-2); }
.tab .frame { position: relative; width: 32px; height: 32px; }
.tab .frame .ico { position: absolute; left: 50%; top: 50%; transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
.tab .ic-default { color: var(--icon-secondary); transform: translate(-50%, -50%) scale(1); }
.tab .ic-active { color: var(--text-brand); opacity: 0; transform: translate(-50%, -50%) scale(0.75); }
.tab[aria-current="page"] .ic-default { opacity: 0; transform: translate(-50%, -50%) scale(1.33); }
.tab[aria-current="page"] .ic-active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.tab .t-nav { color: var(--text-secondary); transition: color 0.2s ease; }
.tab[aria-current="page"] .t-nav { color: var(--text-brand); }

/* ── overlay for tabs outside this concept ───────── */
.elsewhere { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-8); background: var(--bg-canvas); text-align: center; padding: var(--space-24); }
.elsewhere[hidden] { display: none; }
.elsewhere .note { color: var(--text-secondary); }

/* ── press feedback ───────────────────────────────── */
.pressable { transition: opacity 0.15s ease; }
.pressable:active { opacity: 0.6; }
.chip:active { opacity: 0.85; }

/* Reduced motion is honoured, except when the page is opened with ?motion=on (screen recordings on a machine
   that has system animations switched off). */
@media (prefers-reduced-motion: reduce) {
  :root:not(.motion-on) :is(.swap .ico, .pressable, .tab .frame .ico, .tab .t-nav, .chip, .track, .indicator, .segment) { transition: none; }
  :root:not(.motion-on) .when.is-now { animation: none; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="statusbar sys" aria-hidden="true">
      <span class="time">9:41</span>
      <span class="levels">
        <svg width="19" height="12" viewBox="0 0 19 12" fill="#141414"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#141414"><path d="M8.5 2.6c2.3 0 4.4.9 5.9 2.4l1.1-1.1A9.9 9.9 0 0 0 8.5 1 9.9 9.9 0 0 0 1.5 3.9L2.6 5a8.3 8.3 0 0 1 5.9-2.4Zm0 3.2c1.4 0 2.7.6 3.6 1.5l1.1-1.1a6.7 6.7 0 0 0-9.4 0l1.1 1.1c.9-.9 2.2-1.5 3.6-1.5Zm0 3.2c-.6 0-1.1.2-1.4.6L8.5 11l1.4-1.4c-.3-.4-.8-.6-1.4-.6Z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="#141414" opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#141414"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#141414" opacity=".4"/></svg>
      </span>
    </div>

    <div class="main">
      <div class="segments" role="tablist" aria-label="Saved connections">
        <button class="segment t-segment-active" role="tab" aria-selected="true" aria-controls="pane-fav" data-view="fav" id="seg-fav">Favorites</button>
        <button class="segment t-segment" role="tab" aria-selected="false" aria-controls="pane-recent" data-view="recent" id="seg-recent">Recent</button>
        <span class="indicator" id="indicator"></span>
      </div>

      <div class="rule"></div>
      <div class="pager" id="pager">
        <div class="track" id="track">
          <div class="pane" id="pane-fav" role="tabpanel" aria-labelledby="seg-fav"></div>
          <div class="pane" id="pane-recent" role="tabpanel" aria-labelledby="seg-recent" aria-hidden="true" inert></div>
        </div>
      </div>

      <form class="panel" id="panel" aria-label="Find a connection">
        <label class="field">
          <span data-icon="bold:sign-in" data-size="20"></span>
          <input class="value t-field" id="valueFrom" type="text" value="Biskupcova" placeholder="From" aria-label="From"
                 autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next">
          <span data-icon="bold:map-trifold" data-size="20"></span>
        </label>
        <label class="field">
          <span data-icon="bold:sign-out" data-size="20"></span>
          <input class="value t-field" id="valueTo" type="text" value="Vozovna Žižkov" placeholder="To" aria-label="To"
                 autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="search">
          <span data-icon="bold:map-trifold" data-size="20"></span>
        </label>
        <button type="button" class="swap" id="swap" aria-label="Swap origin and destination">
          <span data-icon="bold:arrows-down-up" data-size="20"></span>
        </button>
        <div class="options">
          <button type="button" class="option pressable"><span data-icon="bold:users" data-size="20"></span><span class="label t-option">2 adults</span></button>
          <span class="sep"></span>
          <button type="button" class="option pressable"><span data-icon="bold:clock-countdown" data-size="20"></span><span class="label t-option">Departure now</span></button>
          <span class="sep"></span>
          <button type="button" class="option option--icon pressable" aria-label="Search filters"><span data-icon="bold:sliders" data-size="20"></span></button>
        </div>
        <button type="submit" class="cta t-button">Search</button>
      </form>

      <div class="elsewhere" id="elsewhere" hidden>
        <p class="t-segment-active" id="elsewhereTitle"></p>
        <p class="note t-option">Not part of this concept yet</p>
        <p class="disclaimer">Unofficial redesign concept. Not affiliated with IDOS or CHAPS. Build eeb4404</p>
      </div>
    </div>

    <nav class="tabbar" aria-label="Main">

    var a = segments[ORDER.indexOf(tab)], b = segments[toIndex] || a, p = progress || 0;
    var x = a.offsetLeft + (b.offsetLeft - a.offsetLeft) * p, w = a.offsetWidth + (b.offsetWidth - a.offsetWidth) * p;
    indicator.style.transform = "translateX(" + x + "px) scaleX(" + w + ")";
  }
  function setTab(name) {
    tab = name;
    segments.forEach(function (s) {
      var on = s.getAttribute("data-view") === name;
      s.setAttribute("aria-selected", on ? "true" : "false");
      s.className = "segment " + (on ? "t-segment-active" : "t-segment");
    });
    ORDER.forEach(function (n) {
      panes[n].inert = n !== name;
      panes[n].setAttribute("aria-hidden", n === name ? "false" : "true");
    });
    main.classList.remove("is-dragging");   // transitions back on: the track and the underline glide to rest
    place(0);
    placeIndicator(0);
  }
  segments.forEach(function (seg, i) {
    seg.addEventListener("click", function () { setTab(seg.getAttribute("data-view")); });
    seg.addEventListener("keydown", function (e) {
      var to = segments[i + (e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0)];
      if (to && to !== seg) { e.preventDefault(); to.focus(); setTab(to.getAttribute("data-view")); }
    });
  });

  // Swipe sideways to move between Favorites and Recent. The track follows the finger with no easing, resists
  // at the ends, and on release glides on in the direction it was already moving; it never doubles back unless
  // the swipe is cancelled. Vertical drags are left to the browser, so the page still scrolls.
  var swipe = null;
  pager.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, last: e.clientX, lastT: e.timeStamp, vx: 0, base: 0, pos: 0, active: false };
  });
  window.addEventListener("pointermove", function (e) {
    if (!swipe || e.pointerId !== swipe.id) return;
    var dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (!swipe.active) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (Math.abs(dx) < Math.abs(dy) * 1.4) { swipe = null; return; }
      swipe.active = true;
      // start from where the drag was recognised so nothing jumps, and from where the track is now,
      // which is not its resting place if a glide is still running
      swipe.x = swipe.last = e.clientX; swipe.lastT = e.timeStamp; dx = 0;
      swipe.base = new DOMMatrixReadOnly(getComputedStyle(track).transform).m41;
      main.classList.add("is-dragging");
    }
    swipe.vx = 0.7 * swipe.vx + 0.3 * ((e.clientX - swipe.last) / Math.max(1, e.timeStamp - swipe.lastT));
    swipe.last = e.clientX; swipe.lastT = e.timeStamp;

    var W = pager.clientWidth, i = ORDER.indexOf(tab), rest = -i * W;
    var x = swipe.base + dx, off = x - rest, toward = i + (off < 0 ? 1 : -1);
    if (!ORDER[toward]) { x = rest + off * 0.25; off = x - rest; }          // nothing that way: resist
    swipe.pos = x;
    track.style.transform = "translate3d(" + x + "px,0,0)";
    placeIndicator(ORDER[toward] ? Math.min(1, Math.abs(off) / W) : 0, toward);
  });
  function endSwipe(e, cancelled) {
    if (!swipe || e.pointerId !== swipe.id) return;
    var s = swipe;
    swipe = null;
    if (!s.active) return;
    var eat = function (ev) { ev.stopPropagation(); ev.preventDefault(); };   // a drag must not tap what is under the cursor
    window.addEventListener("click", eat, true);
    setTimeout(function () { window.removeEventListener("click", eat, true); }, 0);

    var W = pager.clientWidth, i = ORDER.indexOf(tab), off = s.pos + i * W;
    var next = ORDER[i + (off < 0 ? 1 : -1)];
    var vx = e.timeStamp - s.lastT > 80 ? 0 : s.vx;                          // a pause before lifting is not a flick
    var far = Math.abs(off) > Math.min(96, W * 0.22);
    var flick = Math.abs(vx) > 0.4 && vx * off > 0 && Math.abs(off) > 20;
    var back = vx * off < 0 && Math.abs(vx) > 0.3;                           // flicked back against the drag: cancel
    setTab(!cancelled && next && !back && (far || flick) ? next : tab);
  }
  window.addEventListener("pointerup", function (e) { endSwipe(e, false); });
  window.addEventListener("pointercancel", function (e) { endSwipe(e, true); });

  // Origin and destination are real text fields. Focusing one selects its value so typing replaces it;
  // Enter on the first moves to the second, Enter on the second (or Search) closes the keyboard.
  var from = document.getElementById("valueFrom"), to = document.getElementById("valueTo");
  [from, to].forEach(function (input) {
    input.addEventListener("focus", function () {
      setTimeout(function () { input.setSelectionRange(0, input.value.length); }, 0);
    });
  });
  from.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); to.focus(); }
  });

  var swap = document.getElementById("swap");
  swap.addEventListener("click", function () {
    var t = from.value; from.value = to.value; to.value = t;
    swap.classList.toggle("is-flipped");
  });
  document.getElementById("panel").addEventListener("submit", function (e) {
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });
  // iOS scrolls overflow:hidden ancestors to reveal a focused field and can leave them shifted once the keyboard closes
  document.addEventListener("focusout", function () {
    setTimeout(function () {
      document.querySelector(".device").scrollTop = 0;
      document.querySelector(".main").scrollTop = 0;
      window.scrollTo(0, 0);
    }, 60);
  });

  var elsewhere = document.getElementById("elsewhere");
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (tab) {
    tab.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) { t.removeAttribute("aria-current"); });
      tab.setAttribute("aria-current", "page");
      var key = tab.getAttribute("data-tab");
      elsewhere.hidden = key === "connection";
      document.getElementById("elsewhereTitle").textContent = key === "tickets" ? "Tickets" : "More";
    });
  });
})();
</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
</script>
</body>
