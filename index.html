<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Unofficial redesign concept of the IDOS Connection screen by Artur K. Not affiliated with IDOS or CHAPS.">
<meta name="theme-color" content="#F1F0F6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>IDOS Home Concept</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<style>
/* IDOS design system — code tokens.
   Source of truth: Figma "Idos" › Redesign › frame "2" (78:2110). Rules: idos-design-system.md.
   Values mirror what is on the canvas. Change a value here only after it changed in Figma. */

:root {
  color-scheme: light;

  /* ── Primitives ─────────────────────────────────────────── */
  --neutral-0: #FFFFFF;
  --neutral-100: #F1F0F6;
  --neutral-150: #E6E6F0;
  --neutral-200: #DBDBDB;
  --neutral-500: #858585;
  --neutral-600: #6B6B6B;
  --neutral-1000: #141414;
  --brand-500: #0171BB;
  --brand-600: #015F9E;
  --green-700: #0A7D0C;
  --red-600: #D00E15;
  --red-500: #E31E25;
  --blue-600: #0000FF;
  --purple-600: #800080;
  --green-600: #009847;
  --yellow-500: #FDC500;

  /* ── Semantic: colour ───────────────────────────────────── */
  --bg-canvas: var(--neutral-100);          /* screen background */
  --bg-surface: var(--neutral-0);           /* chips, search panel, swap button */
  --text-primary: var(--neutral-1000);
  --text-secondary: var(--neutral-600);     /* 5.33:1 on white, 4.70:1 on canvas: passes AA */
  --text-inverse: var(--neutral-0);
  --text-brand: var(--brand-500);
  --icon-primary: var(--neutral-1000);
  --icon-secondary: var(--neutral-500);     /* 3.69:1 on white, 3.26:1 on canvas: passes the 3:1 for icons */
  --border-subtle: var(--neutral-150);      /* dividers inside a surface */
  --border-default: var(--neutral-200);     /* rules on the canvas, dot separators */
  --border-strong: var(--neutral-1000);     /* active segmented-tab underline */
  --action-primary: var(--brand-500);
  --action-primary-pressed: var(--brand-600);
  --amenity: var(--green-700);              /* platform marker + letter */
  --status-ok: var(--green-700);            /* "on time" text and its dot, 5.33:1 on white; the only status colour */
  --bg-scrim: rgb(20 20 20 / 0.4);          /* behind a bottom sheet */

  /* Line colours: identity of the route, never status */
  --line-tram: var(--red-600);
  --line-bus: var(--blue-600);
  --line-bus-x: var(--purple-600);
  --line-train-red: var(--red-600);
  --line-train-green: var(--green-600);
  --line-metro-a: var(--green-600);
  --line-metro-b: var(--yellow-500);
  --line-metro-c: var(--red-500);
  --on-line: var(--neutral-0);
  --on-line-metro-b: var(--neutral-1000);   /* the only dark-on-colour badge */

  /* ── Typography ─────────────────────────────────────────── */
  --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* ── Spacing (2px steps below 12, 4px steps above) ──────── */
  --space-2: 2px;
  --space-4: 4px;
  --space-6: 6px;
  --space-8: 8px;
  --space-10: 10px;
  --space-12: 12px;
  --space-16: 16px;
  --space-20: 20px;
  --space-24: 24px;
  --space-32: 32px;
  --space-40: 40px;

  /* ── Layout ─────────────────────────────────────────────── */
  --margin-content: var(--space-32);        /* lists, segmented tabs, tab bar */
  --margin-panel: var(--space-16);          /* docked search panel */
  --gap-section: var(--space-20);           /* between route cards; panel → tab bar */

  /* ── Radius ─────────────────────────────────────────────── */
  --radius-sm: 4px;                         /* chips, panels: the only visible radius */
  --radius-full: 999px;                     /* swap button, dots */

  /* ── Size ───────────────────────────────────────────────── */
  --icon-xs: 12px;
  --icon-sm: 16px;
  --icon-md: 20px;
  --icon-lg: 24px;
  --tap-min: 44px;
  --row-field: 56px;
  --row-control: 48px;
}

/* ── Type roles: use these, never raw font settings ──────── */
.t-segment        { font: 500 20px/24px var(--font-ui); letter-spacing: -0.5px; }
.t-segment-active { font: 600 20px/24px var(--font-ui); letter-spacing: -0.5px; }
.t-field          { font: 500 18px/24px var(--font-ui); letter-spacing: -0.5px; }
.t-time-active    { font: 600 16px/22px var(--font-ui); letter-spacing: -0.5px; }
.t-time           { font: 500 14px/22px var(--font-ui); letter-spacing: -0.25px; }
.t-code           { font: 700 14px/20px var(--font-ui); letter-spacing: 0; }
.t-button         { font: 700 14px/20px var(--font-ui); letter-spacing: 0; text-transform: uppercase; }
.t-option         { font: 600 12px/18px var(--font-ui); letter-spacing: 0; text-transform: uppercase; }
.t-link           { font: 700 12px/18px var(--font-ui); letter-spacing: 0; text-transform: uppercase; }
.t-nav            { font: 700 12px/20px var(--font-ui); letter-spacing: 0; text-transform: uppercase; }
.t-place-strong   { font: 600 14px/20px var(--font-ui); letter-spacing: 0; }
.t-row            { font: 500 18px/24px var(--font-ui); letter-spacing: -0.5px; }
.t-row-meta       { font: 500 14px/20px var(--font-ui); letter-spacing: 0; }
.t-stop           { font: 500 16px/22px var(--font-ui); letter-spacing: -0.25px; }


/* Prototype chrome only (device frame, system bars). Not part of the design system. */
:root { --proto-backdrop: #E3E2EA; }

html, body { height: 100%; overscroll-behavior: none; }
body { background: var(--proto-backdrop); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.device { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.disclaimer { font: 500 12px/18px var(--font-ui); color: var(--text-secondary); text-align: center; }
.disclaimer.sys { color: var(--text-primary); }   /* sits on the darker desktop backdrop, where the grey would be 4.1:1 */
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--action-primary); outline-offset: 2px; }
p { margin: 0; }
.ico { display: block; flex: none; }

.stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-16); padding-block: 32px; padding-inline: 16px; }
.device {
  position: relative; width: 393px; height: 852px; overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--bg-canvas); color: var(--text-primary);
  border-radius: 52px;
  box-shadow: 0 0 0 1px rgb(20 20 20 / 0.08), 0 40px 80px -32px rgb(20 20 20 / 0.35);
  font-family: var(--font-ui);
}
@media (max-width: 520px) {
  body { background: var(--bg-canvas); }
  /* a real height (not min-height), otherwise the device's height:100% has nothing to resolve against
     and the screen shrinks to its content instead of filling a tall phone */
  .stage { padding: 0; gap: 0; height: 100%; min-height: 0; }
  .device { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
  .sys { display: none !important; }
}

/* system status bar + home indicator: drawn on desktop only, the phone has real ones */
.statusbar { flex: none; height: 59px; display: flex; align-items: center; justify-content: space-between; padding: 11px 32px 11px 48px; }
.statusbar .time { font: 600 17px/22px system-ui, -apple-system, sans-serif; }
.statusbar .levels { display: flex; gap: 6px; align-items: center; }
.home-zone { flex: none; height: 42px; display: flex; justify-content: center; padding-top: 30px; }
.home-zone span { width: 140px; height: 5px; border-radius: var(--radius-full); background: rgb(0 0 0 / 0.35); }
@media (max-width: 520px) { .home-zone { height: var(--space-8); padding: 0; } .home-zone span { display: none; } }

.main { --ease-page: cubic-bezier(0.3, 0.6, 0.35, 1); position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ── segmented tabs ───────────────────────────────── */
.segments { position: relative; flex: none; display: flex; gap: var(--space-16); margin: 17px var(--margin-content) 0; height: 44px; }
.segment { padding-bottom: var(--space-20); color: var(--text-secondary); transition: color 0.25s ease; }
.segment[aria-selected="true"] { color: var(--text-primary); }
/* One underline bar that slides with the pages; the script writes its x and width (scaleX of a 1px bar). */
.indicator { position: absolute; left: 0; bottom: 0; width: 1px; height: 2px; background: var(--border-strong); transform-origin: 0 0; will-change: transform; transition: transform 0.42s var(--ease-page); }

/* ── tab pages ────────────────────────────────────── */
/* Favorites and Recent sit side by side on one track. A swipe drags the track; letting go only finishes the
   movement in the direction the finger was already going, so it is one continuous motion. */
.rule { flex: none; height: 1px; margin: 0 var(--margin-content); background: var(--border-default); }
/* The glide starts at about the speed of a flicking finger (initial slope 2) and only then eases out, so letting
   go does not make the page jump ahead. A steeper curve like (0.22, 1, 0.36, 1) starts 3x faster than the finger. */
.pager { flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; }
.track { display: flex; height: 100%; will-change: transform; transition: transform 0.42s var(--ease-page); }
.main.is-dragging :is(.track, .indicator) { transition: none; }
.pane { flex: none; width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; touch-action: pan-y; }
.pane::-webkit-scrollbar { display: none; }
.cards { display: flex; flex-direction: column; gap: var(--gap-section); padding-top: var(--gap-section); }
.view-all { display: block; margin: 0 var(--margin-content); padding: var(--space-8) 0; color: var(--text-secondary); }

.card { display: flex; flex-direction: column; gap: var(--space-10); padding-bottom: var(--space-8); }
.card[hidden] { display: none; }
.card-head { display: flex; align-items: center; gap: var(--space-4); width: calc(100% - 2 * var(--margin-content)); margin: 0 var(--margin-content); min-width: 0; min-height: 20px; }
.card-head .names { display: flex; align-items: center; gap: var(--space-8); min-width: 0; }
.card-head .from { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head .to { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot3 { flex: none; width: 3px; height: 3px; border-radius: var(--radius-full); background: var(--icon-secondary); }
.card-head .ico { color: var(--icon-secondary); }

/* Two chips fill the row exactly, so the row never scrolls and a horizontal swipe is free to switch tabs.
   Spacing between chips is a margin, not a gap, so a leaving chip can collapse to nothing. */
.chips { display: flex; overflow: hidden; padding-left: var(--margin-content); }
/* end spacer: last chip's 8px margin + 24px = the 32px margin on the right */
.chips::after { content: ""; flex: none; width: var(--space-24); }

/* Horizontal drags belong to the tab swipe; vertical ones still scroll the page. */
.chips { touch-action: pan-y; }

/* Chip width follows the screen so two chips always fill the 32px margins:
   393 → 160.5 (Figma 160), 428 (iPhone 13 Pro Max) → 178, 375 → 151.5. */
.device { container-type: inline-size; }
.chip {
  flex: none; display: flex; width: 160px; height: 60px; margin-right: var(--space-8);
  background: var(--bg-surface); border-radius: var(--radius-sm); overflow: hidden;
  transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), margin-right 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
}
@supports (width: 1cqw) { .chip { width: clamp(140px, calc((100cqw - 72px) / 2), 240px); } }
.chip.is-entering, .chip.is-leaving { width: 0; margin-right: 0; opacity: 0; }
.chip.is-leaving { pointer-events: none; }

/* "now" blinks over the hold, then the chip leaves. --blink (one cycle) and --blinks (count) are set from the script. */
.when.is-now { animation: now-blink var(--blink, 650ms) ease-in-out var(--blinks, 4); }
@keyframes now-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.badge { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-4); width: 48px; color: var(--on-line); }
.badge .glyphs { display: flex; align-items: center; }
:is(.badge, .line-tag)[data-line="tram"] { background: var(--line-tram); }
:is(.badge, .line-tag)[data-line="bus"] { background: var(--line-bus); }
:is(.badge, .line-tag)[data-line="bus-x"] { background: var(--line-bus-x); }
:is(.badge, .line-tag)[data-line="train-red"] { background: var(--line-train-red); }
:is(.badge, .line-tag)[data-line="train-green"] { background: var(--line-train-green); }
:is(.badge, .line-tag)[data-line="metro-a"] { background: var(--line-metro-a); }
:is(.badge, .line-tag)[data-line="metro-b"] { background: var(--line-metro-b); color: var(--on-line-metro-b); }
:is(.badge, .line-tag)[data-line="metro-c"] { background: var(--line-metro-c); }

.chip-info { display: flex; flex-direction: column; justify-content: center; gap: var(--space-4); min-width: 0; padding: 0 var(--space-16) var(--space-4) var(--space-10); }
.chip-info .when { white-space: nowrap; font-variant-numeric: tabular-nums; }
.amenities { display: flex; align-items: center; gap: var(--space-6); color: var(--icon-secondary); }
.platform { display: flex; align-items: center; gap: var(--space-4); color: var(--amenity); }

/* ── search panel ─────────────────────────────────── */
.panel { position: relative; flex: none; margin: var(--space-8) var(--margin-panel) 0; background: var(--bg-surface); border-radius: var(--radius-sm); }
.field { display: flex; align-items: center; gap: var(--space-8); width: 100%; height: var(--row-field); padding: 0 var(--space-16); color: var(--icon-secondary); cursor: text; }
.field + .field { border-top: 1px solid var(--border-subtle); }
/* a real text input: Figma draws the value in text-secondary, it turns primary while being edited */
.field .value {
  flex: 1; min-width: 0; height: 100%; margin: 0; padding: 0; border: 0; border-radius: 0; outline: 0; background: none;
  -webkit-appearance: none; appearance: none; text-overflow: ellipsis;
  color: var(--text-secondary); caret-color: var(--action-primary);
  -webkit-user-select: text; user-select: text;   /* the device frame disables selection; an input must not inherit that */
}
.field .value::placeholder { color: var(--text-secondary); opacity: 1; }
.field:focus-within .value { color: var(--text-primary); }
.swap {
  position: absolute; top: 36px; right: 48px; width: 40px; height: 40px; border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--border-subtle); color: var(--icon-secondary);
}
.swap .ico { transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
.swap.is-flipped .ico { transform: rotate(180deg); }
.options { display: flex; align-items: center; justify-content: space-between; height: var(--row-control); padding: 0 var(--space-16); border-top: 1px solid var(--border-subtle); }
.option { display: flex; align-items: center; gap: var(--space-8); min-height: var(--tap-min); color: var(--icon-secondary); }
.option .label { color: var(--text-primary); }
.option--icon { justify-content: center; min-width: var(--tap-min); margin-right: calc(-1 * var(--space-12)); }
.sep { flex: none; width: 4px; height: 4px; border-radius: var(--radius-full); background: var(--border-default); }
.cta { display: flex; align-items: center; justify-content: center; width: 100%; height: var(--row-control); background: var(--action-primary); color: var(--text-inverse); border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
.cta:active { background: var(--action-primary-pressed); }

/* ── tab bar ──────────────────────────────────────── */
.tabbar { flex: none; display: flex; height: 56px; margin: var(--gap-section) var(--margin-content) 0; }
/* Tab item, State = Default | Active (Figma set 61:1161) */
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); padding-top: var(--space-2); }
.tab .frame { position: relative; width: 32px; height: 32px; }
.tab .frame .ico { position: absolute; left: 50%; top: 50%; transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
.tab .ic-default { color: var(--icon-secondary); transform: translate(-50%, -50%) scale(1); }
.tab .ic-active { color: var(--text-brand); opacity: 0; transform: translate(-50%, -50%) scale(0.75); }
.tab[aria-current="page"] .ic-default { opacity: 0; transform: translate(-50%, -50%) scale(1.33); }
.tab[aria-current="page"] .ic-active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.tab .t-nav { color: var(--text-secondary); transition: color 0.2s ease; }
.tab[aria-current="page"] .t-nav { color: var(--text-brand); }

/* ── More: a plain list of destinations ───────────── */
/* Same frame as Connection: a 20px title where the tabs sit, the 1px rule, then white groups on the canvas.
   Rows are separated inside a group by border-subtle, groups by the 20px section gap. */
.more { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg-canvas); }
.more[hidden] { display: none; }
.more-title { flex: none; height: 44px; margin: 17px var(--margin-content) 0; padding-bottom: var(--space-20); }
.more-title h1 { margin: 0; font-weight: inherit; font-size: inherit; line-height: inherit; }
.more-list { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: var(--gap-section); padding: var(--gap-section) var(--margin-content) var(--space-24); }
.more-list::-webkit-scrollbar { display: none; }
.group { flex: none; background: var(--bg-surface); border-radius: var(--radius-sm); overflow: hidden; }
.row { display: flex; align-items: center; gap: var(--space-12); width: 100%; min-height: var(--row-field); padding: 0 var(--space-16); color: var(--icon-secondary); transition: background-color 0.15s ease; }
.row + .row { border-top: 1px solid var(--border-subtle); }
.row:active { background: var(--bg-canvas); }
.row .label { flex: 1; min-width: 0; color: var(--text-primary); }
.row--account { min-height: 72px; }
.row--account .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.row--account .who .label { flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row--account .who .meta { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.more-list .disclaimer { padding-top: var(--space-4); }

/* ── Trip detail: one connection, leg by leg ───────── */
/* A separate page over Connection, like More. The leg is the repeating unit: a line tag, its direction, then
   departure, optional intermediate stops, arrival and a status line, joined by a dotted rail. */
.trip { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg-canvas); visibility: hidden; transform: translateX(100%); transition: transform 0.4s var(--ease-page), visibility 0s 0.4s; }
.trip.is-open { visibility: visible; transform: none; transition: transform 0.4s var(--ease-page); }
.trip-bar { flex: none; display: flex; align-items: center; height: 44px; margin: 17px var(--space-8) 0; }
.trip-bar .spacer { flex: 1; }
.icon-btn { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-full); color: var(--icon-primary); transition: background-color 0.15s ease; }
.icon-btn:active { background: var(--bg-surface); }
.icon-btn[aria-pressed="true"] { color: var(--text-brand); }
.icon-btn[hidden] { display: none; }
.trip-scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: var(--gap-section); padding: var(--gap-section) var(--margin-panel) var(--space-24); }
.trip-scroll::-webkit-scrollbar { display: none; }

.trip-summary { flex: none; display: flex; align-items: center; gap: var(--space-8); padding: 0 var(--space-4); }
.trip-summary .meta { margin-left: auto; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.dot-ok { flex: none; width: 10px; height: 10px; border-radius: var(--radius-full); background: var(--status-ok); }

.leg { padding: var(--space-16) var(--space-16) var(--space-16) 48px; }
.leg + .leg { border-top: 1px solid var(--border-subtle); }
.leg-head { display: flex; align-items: center; gap: var(--space-8); min-height: 28px; margin-left: -32px; padding-left: var(--space-8); }
.line-tag { display: inline-flex; align-items: center; gap: var(--space-6); height: 28px; padding: 0 var(--space-8); border-radius: var(--radius-sm); color: var(--on-line); }
.line-tag .ico { width: 16px; height: 16px; }
.leg-head .acc { color: var(--icon-secondary); }
.leg-head .warn { margin-left: auto; color: var(--text-primary); display: flex; }
.leg-dir { margin: var(--space-4) 0 0; color: var(--text-secondary); }
.stops { position: relative; display: flex; flex-direction: column; gap: var(--space-4); margin-top: var(--space-12); }
.stops::before { content: ""; position: absolute; left: -27px; top: 11px; bottom: 11px; border-left: 2px dotted var(--border-default); }
.stop { position: relative; display: flex; align-items: flex-start; gap: var(--space-8); min-height: 22px; }
.stop::before { content: ""; position: absolute; left: -31px; top: 6px; width: 10px; height: 10px; box-sizing: border-box; border: 2px solid var(--text-primary); border-radius: var(--radius-full); background: var(--bg-surface); }
.stop .time { flex: none; min-width: 36px; font-variant-numeric: tabular-nums; }
.stop .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.stop .tail { flex: none; display: flex; align-items: center; gap: var(--space-8); height: 22px; color: var(--icon-secondary); }
.via-toggle { display: flex; align-items: center; gap: var(--space-8); min-height: var(--tap-min); margin: -8px 0 -8px -4px; padding: 0 var(--space-4); color: var(--text-secondary); text-align: left; }

<script>

    { id: "f0", from: "Nádraží Veleslavín", to: "Letiště Praha", services: [
      { line: "bus", code: "119", platform: "F", wheelchair: true, cooled: true, first: 1, every: 15 },

    { id: "f3", from: "Biskupcova", to: "Vozovna Žižkov", services: [
      { line: "tram", code: "9", platform: "B", wheelchair: true, cooled: true, first: 3, every: 8 } ] }

    // r0 is a real IDOS connection (idos-trips.js): a night tram, so its trip screen runs on a 3:10 clock
    { id: "r0", from: "Praha, Divadlo pod Palmovkou", to: "Praha, Terminál 1", services: [

    { id: "r1", from: "Biskupcova", to: "Vozovna Žižkov", services: [

    var v = viewOf(d), w = el.querySelector(".when"), text = when(v), cls = "when " + timeClass(v) + (v.min <= 0 ? " is-now" : "");

  // without scrolling, so a tall phone gets a fourth row and the 852 design frame keeps three.

    return '<div class="stop"><span class="time t-time-active">' + fmt(mins) + '</span><span class="name t-stop">' + esc(s.n) + "</span>" +
      '<span class="tail">' + (s.a ? icon("bold:wheelchair", 16) : "") +
      (s.p ? '<span class="platform">' + icon("bold:arrows-in-cardinal", 16) + '<span class="t-code">' + esc(s.p) + "</span></span>" : "") + "</span></div>";
  }
  function renderTrip(c) {
    var d = c.data, start = c.day + c.t, legs = d.legs;
    var total = legs[legs.length - 1].arr - legs[0].dep, html = "";
    html += '<div class="trip-summary"><span class="dot-ok" aria-hidden="true"></span><span class="when t-time-active" id="tripWhen"></span>' +
      '<span class="meta t-row-meta">' + dur(total) + ", " + d.km + " km</span></div>";

    html += '<div class="group legs">';
    legs.forEach(function (l, i) {
      var via = l.via || [], vid = "via-" + i;
      var glyphs = GLYPH[l.line].map(function (k) { return icon(k, 16); }).join("");
      if (l.walk) html += '<div class="transfer t-row-meta">' + icon("bold:person-simple-walk", 20) + "<span>transfer about " + l.walk + " min</span></div>";
      html += '<section class="leg"><div class="leg-head">' +
        '<span class="line-tag" data-line="' + l.line + '" role="img" aria-label="' + esc(MODE[l.line] + " " + l.code) + '">' + glyphs + '<span class="t-code">' + esc(l.code) + "</span></span>" +
        (l.low ? '<span class="acc" role="img" aria-label="Low-floor vehicle">' + icon("bold:wheelchair", 16) + "</span>" : "") +
        (l.warn ? '<span class="warn" role="img" aria-label="Traffic restrictions on this leg">' + icon("bold:warning", 16) + "</span>" : "") + "</div>" +
        '<p class="leg-dir t-row-meta">direction ' + esc(l.dir) + "</p>" +
        '<div class="stops">' + stopHtml(start + l.dep, l.from) +
        (via.length ? '<button type="button" class="via-toggle t-row-meta" aria-expanded="false" aria-controls="' + vid + '">' + icon("bold:caret-down", 16) +
          "<span>" + via.length + " intermediate stop" + (via.length > 1 ? "s" : "") + "</span></button>" +
          '<div class="via" id="' + vid + '" inert><div>' + via.map(function (n, k) {
            var at = Math.round(l.dep + (l.arr - l.dep) * (k + 1) / (via.length + 1));
            return '<div class="via-row t-row-meta"><span class="time">' + fmt(start + at) + '</span><span class="name">' + esc(n) + "</span></div>";
          }).join("") + "</div></div>" : "") +
        stopHtml(start + l.arr, l.to) + "</div>" +
        '<p class="leg-status t-row-meta">' + (l.status === "on" ? "on time" : "departure is usually on time") + icon("bold:clock-counter-clockwise", 16) + "</p></section>";
    });
    html += "</div>";

    if (d.restrictions && d.restrictions.length) {
      html += '<section class="sec"><h2 class="sec-title t-place-strong">Traffic restrictions</h2><div class="group">' +
        d.restrictions.map(function (t) { return '<div class="info-row">' + icon("bold:warning", 20) + '<p class="t-row-meta">' + esc(t) + "</p></div>"; }).join("") + "</div></section>";
    }
    if (d.carriers && d.carriers.length) {
      html += '<section class="sec"><h2 class="sec-title t-place-strong">Carriers and contacts</h2><div class="group">' +
        d.carriers.map(function (k) { return '<div class="info-row"><span class="bullet" aria-hidden="true"></span><p class="t-row-meta">' + esc(k.who) + ' <span class="sub">(' + esc(k.lines) + ")</span></p></div>"; }).join("") + "</div></section>";
    }
    if (d.fare) {
      html += '<section class="sec"><h2 class="sec-title t-place-strong">Fare</h2><div class="group"><dl class="fare t-row-meta">' +
        "<dt>Section:</dt><dd>" + esc(d.fare.section) + "</dd><dt>Tariff:</dt><dd>" + esc(d.fare.tariff) + "</dd><dt>Price:</dt><dd>" + esc(d.fare.price) + "</dd></dl></div></section>";
    }
    tripScroll.innerHTML = html;
  }

  // The countdown under the legs is the same number the chip shows.
  function updateTrip() {
    if (!current) return;
    var el = document.getElementById("tripWhen");
    if (!el) return;
    var min = current.t - clock, text = min <= 0 ? "now" : "in " + min + " min", cls = "when t-time-active" + (min === 0 ? " is-now" : "");
    if (el.textContent !== text) { el.textContent = text; if (min === 0) tripLive.textContent = "Departing now"; }
    if (el.className !== cls) el.className = cls;
  }

  function setBell(on) {
    var b = document.getElementById("tripBell");
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.setAttribute("aria-label", on ? "Notifications on for this trip" : "Notify me about this trip");
    b.innerHTML = icon(on ? "fill:bell" : "bold:bell", 24);
  }

  function showTrip(routeId, idx, t, from) {
    var data = TRIPS[routeId + ":" + idx], r = ROUTES[routeId];
    if (!data) { toast("Trip details are not part of this concept yet"); return; }
    openTrip({ routeId: routeId, t: t, data: data, day: data.day == null ? 581 : data.day, key: routeId + ":" + idx + ":" + t, title: r.from + " to " + r.to }, from);
  }
  function openTrip(c, from) {
    current = c;
    origin = from;
    renderTrip(current);
    tripScroll.scrollTop = 0;
    updateTrip();
    setBell(!!bellOn[current.key]);
    connectionEls.forEach(function (el) { el.inert = true; });
    resultsEl.inert = true;
    tripEl.classList.add("is-open");
    document.getElementById("tripBack").focus({ preventScroll: true });
  }
  function closeTrip() {
    if (!current) return;
    closeSheet(true, "trip");
    tripEl.classList.remove("is-open");
    if (res) resultsEl.inert = false; else connectionEls.forEach(function (el) { el.inert = false; });
    var back = origin;
    current = null; origin = null;
    if (back && back.isConnected && !back.classList.contains("is-leaving")) back.focus({ preventScroll: true });
    else if (res) document.getElementById("resBack").focus({ preventScroll: true });
  }

  function openSheet(page) {
    if (sheetOpen || (page === "trip" && !current) || (page === "results" && !res)) return;
    var inTrip = page === "trip", onFav = inTrip && current.routeId && FAVORITES.indexOf(ROUTES[current.routeId]) >= 0;
    document.getElementById("favLabel").textContent = onFav ? "Remove from favorites" : "Add to favorites";
    sheetOpen = true; sheetPage = page;
    (inTrip ? tripEl : resultsEl).inert = true;
    toastEl.classList.remove("is-on");
    scrimEl.classList.add("is-open"); sheetEl.classList.add("is-open");
    sheetEl.querySelector(".row").focus({ preventScroll: true });
  }
  function closeSheet(quiet, page) {
    if (!sheetOpen || (page && page !== sheetPage)) return;
    sheetOpen = false;
    var inTrip = sheetPage === "trip";
    (inTrip ? tripEl : resultsEl).inert = false;
    scrimEl.classList.remove("is-open"); sheetEl.classList.remove("is-open");
    if (!quiet) document.getElementById(inTrip ? "tripMore" : "resMore").focus({ preventScroll: true });
    sheetPage = null;
  }

  document.getElementById("tripBack").addEventListener("click", closeTrip);
  document.getElementById("tripMap").addEventListener("click", function () { toast("Map is not part of this concept yet"); });
  document.getElementById("tripMore").addEventListener("click", function () { openSheet("trip"); });
  document.getElementById("tripBell").addEventListener("click", function () {
    if (!current) return;
    bellOn[current.key] = !bellOn[current.key];
    setBell(bellOn[current.key]);
    tripLive.textContent = bellOn[current.key] ? "Notifications on" : "Notifications off";
  });
  var shareBtn = document.getElementById("tripShare");
  if (!navigator.share) shareBtn.hidden = true;                                  // no system share sheet here: do not show a dead button
  shareBtn.addEventListener("click", function () {
    if (!current) return;
    var r = ROUTES[current.routeId];
    navigator.share({ title: "IDOS concept", text: r.from + " to " + r.to, url: location.href.split("?")[0] }).catch(function () {});
  });
  scrimEl.addEventListener("click", function () { closeSheet(); });
  sheetEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    closeSheet();
    if (act === "refresh") toast("Updated just now");
    else if (act !== "cancel") toast("Not part of this concept yet");
  });
  tripScroll.addEventListener("click", function (e) {
    var b = e.target.closest(".via-toggle");
    if (!b) return;
    var open = b.getAttribute("aria-expanded") !== "true", via = document.getElementById(b.getAttribute("aria-controls"));
    b.setAttribute("aria-expanded", open ? "true" : "false");
    via.classList.toggle("is-open", open);
    via.inert = !open;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (sheetOpen) closeSheet(); else if (current) closeTrip(); else if (res) closeResults();
  });

  // ══ Search results ════════════════════════════════════════════════════════════════════════════════════
  // Search lists whole connections, soonest first; a result opens its trip. A pair that matches a saved route uses
  // that route's real trips, any other pair gets plausible generated ones (concept data, deterministic per pair).
  var DPP_WHO = "Dopravní podnik hl.m. Prahy, a.s.; Praha 9; 296 191 817 (296 197 150)";
  var HUBS = ["Můstek", "Florenc", "Anděl", "Muzeum", "Karlovo náměstí", "Dejvická", "Hlavní nádraží", "Náměstí Republiky"];
  var VIA = ["Náměstí Míru", "Jiřího z Poděbrad", "Flora", "Želivského", "Hradčanská", "Malostranská", "Staroměstská", "Vltavská", "Palmovka", "Invalidovna", "Karlovo náměstí", "Újezd", "Ořechovka", "Bořislavka"];
  var ENDS = ["Černý Most", "Zličín", "Letňany", "Depo Hostivař", "Sídliště Barrandov", "Lehovec", "Kobylisy"];
  var TRAMS = ["9", "22", "24", "26", "6", "17"], BUSES = ["119", "133", "207", "136", "175"];

  function hash(s) { var n = 7; for (var i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) | 0; return Math.abs(n); }
  function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
  function fits(saved, typed) { return typed.length >= 3 && (saved.indexOf(typed) >= 0 || typed.indexOf(saved) >= 0); }
  function matchRoute(a, b) {
    var na = norm(a), nb = norm(b), found = null;
    FAVORITES.concat(RECENT).forEach(function (r) {
      if (!found && TRIPS[r.id + ":0"] && fits(norm(r.from), na) && fits(norm(r.to), nb)) found = r;
    });
    return found;
  }
  function stopOf(n, p, a) { return { n: n, p: p, a: !!a }; }
  function viaList(n, seed) { var out = []; for (var i = 0; i < n; i++) out.push(VIA[(seed + i * 3) % VIA.length]); return out; }

  function genTrip(a, b, k) {
    var v = hash(norm(a) + ">" + norm(b)) + k * 7, kind = ["tram", "bus", "metro+tram", "bus", "metro+bus"][v % 5], plat = "ABCD".charAt((v >> 1) % 4), legs;
    if (kind.indexOf("+") < 0) {
      var dd = 12 + v % 24, isTram = kind === "tram";
      legs = [{ line: isTram ? "tram" : "bus", code: isTram ? TRAMS[v % TRAMS.length] : BUSES[v % BUSES.length], dir: ENDS[(v >> 2) % ENDS.length], dep: 0, arr: dd,
        status: v % 3 ? "on" : "usual", low: v % 4 !== 0, from: stopOf(a, plat, true), to: stopOf(b, "ABCD".charAt((v >> 3) % 4), true), via: viaList(1 + v % 4, v) }];
    } else {
      var hub = HUBS[(v >> 2) % HUBS.length];
      if (norm(hub) === norm(a) || norm(hub) === norm(b)) hub = HUBS[((v >> 2) + 1) % HUBS.length];
      var m = v % 3, d1 = 8 + v % 11, walk = 2 + v % 3, d2 = 7 + (v >> 3) % 12, tram = kind === "metro+tram";
      legs = [
        { line: "metro-" + "abc".charAt(m), code: "ABC".charAt(m), dir: ENDS[v % ENDS.length], dep: 0, arr: d1, status: "on", low: true,
          from: stopOf(a, "1", true), to: stopOf(hub, "2", true), via: viaList(1 + v % 3, v) },
        { line: tram ? "tram" : "bus", code: tram ? TRAMS[(v >> 1) % TRAMS.length] : BUSES[(v >> 1) % BUSES.length], dir: ENDS[(v >> 4) % ENDS.length], walk: walk,
          dep: d1 + walk, arr: d1 + walk + d2, status: "usual", low: v % 2 === 0, from: stopOf(hub, plat, true), to: stopOf(b, "ABCD".charAt((v >> 3) % 4), true), via: viaList(1 + (v >> 2) % 3, v + 5) }
      ];
    }
    var total = legs[legs.length - 1].arr;
    return {
      km: Math.max(2, Math.round(total * 0.5)), legs: legs, restrictions: [],
      carriers: [{ who: DPP_WHO, lines: legs.map(function (l) { return MODE[l.line] + " " + l.code; }).join(", ") }],
      fare: { section: a + " - " + b, tariff: "long-term local ticket - zone P / in application",
        price: total <= 30 ? "30,-CZK / 27,-CZK (30 min)" : total <= 90 ? "40,-CZK / 36,-CZK (90 min)" : "60,-CZK / 54,-CZK (90 min)" }
    };
  }

  // Next `n` results for the open search.
  function growResults(n) {
    for (var i = 0; i < n; i++) {
      var k = res.items.length, item;
      if (res.route) {
        var slot = res.slots[k];
        if (!slot) return;
        var data = TRIPS[res.route.id + ":" + slot.idx];
        item = { data: data, t: slot.t, day: data.day == null ? 581 : data.day, routeId: res.route.id, key: res.route.id + ":" + slot.idx + ":" + slot.t, n: k };
      } else {
        res.lastT = res.lastT == null ? clock + 2 + hash(res.a + res.b) % 4 : res.lastT + 6 + hash(res.a + res.b + k) % 6;
        item = { data: genTrip(res.a, res.b, k), t: res.lastT, day: 581, routeId: null, key: "s:" + hash(res.a + res.b) + ":" + k + ":" + res.lastT, n: k };
      }
      res.items.push(item);
    }
  }

  function tagHtml(l) {
    return '<span class="line-tag" data-line="' + l.line + '" role="img" aria-label="' + esc(MODE[l.line] + " " + l.code) + '">' +
      GLYPH[l.line].map(function (k) { return icon(k, 16); }).join("") + '<span class="t-code">' + esc(l.code) + "</span></span>";
  }
  function rStop(mins, s) {
    return '<span class="rstop"><span class="time t-time-active">' + fmt(mins) + '</span><span class="name t-stop">' + esc(s.n) + "</span>" +
      '<span class="tail">' + (s.p ? '<span class="platform">' + icon("bold:arrows-in-cardinal", 16) + '<span class="t-code">' + esc(s.p) + "</span></span>" : "") + "</span></span>";
  }
  function resultHtml(it, i) {
    var legs = it.data.legs, start = it.day + it.t, total = legs[legs.length - 1].arr - legs[0].dep;
    return '<button type="button" class="result group" data-i="' + i + '"><span class="result-body">' +
      '<span class="result-sum"><span class="dot-ok" aria-hidden="true"></span><span class="when t-time-active"></span><span class="meta t-row-meta">' + dur(total) + "</span></span>" +
      legs.map(function (l) {
        return '<span class="rleg"><span class="rleg-head">' + tagHtml(l) +
          (l.low ? '<span class="acc" role="img" aria-label="Low-floor vehicle">' + icon("bold:wheelchair", 16) + "</span>" : "") +
          (l.warn ? '<span class="warn" role="img" aria-label="Traffic restrictions on this leg">' + icon("bold:warning", 16) + "</span>" : "") + "</span>" +
          rStop(start + l.dep, l.from) + rStop(start + l.arr, l.to) +
          '<span class="rleg-status t-row-meta">' + (l.status === "on" ? "on time" : "departure is usually on time") + icon("bold:clock-counter-clockwise", 16) + "</span></span>";
      }).join("") + '</span><span class="chev" aria-hidden="true">' + icon("bold:caret-right", 16) + "</span></button>";
  }
  function renderResults(focusIndex) {
    var html = '<h1 class="results-title t-field"><span class="line">' + icon("bold:sign-in", 20) + '<span class="name">' + esc(res.a) + "</span></span>" +
      '<span class="line">' + icon("bold:sign-out", 20) + '<span class="name">' + esc(res.b) + "</span></span></h1>";
    if (!res.items.length) html += '<p class="empty t-row-meta">No connections found.</p>';
    else html += '<div class="results-list">' + res.items.map(resultHtml).join("") + "</div>";
    if (!res.done) html += '<div class="group"><button type="button" class="later t-link" id="resLater">Later connections</button></div>';
    resultsScroll.innerHTML = html;
    updateResults(true);
    if (focusIndex != null) { var el = resultsScroll.querySelectorAll(".result")[focusIndex]; if (el) el.focus({ preventScroll: false }); }
  }

  // Countdowns stay in step with the chips; a departure that has left drops off the list.
  function updateResults(force) {
    if (!res) return;
    var changed = false;
    while (res.items.length && res.items[0].t - clock < 0) { res.items.shift(); changed = true; }
    if (res.items.length < 3 && !res.done) { var before = res.items.length; growResults(3); if (res.items.length === before) res.done = true; changed = true; }
    if (changed && !force) { renderResults(); return; }
    var els = resultsScroll.querySelectorAll(".result");
    for (var i = 0; i < els.length; i++) {
      var it = res.items[+els[i].getAttribute("data-i")];
      if (!it) continue;
      var min = it.t - clock, w = els[i].querySelector(".when"), text = min <= 0 ? "now" : "in " + min + " min", cls = "when t-time-active" + (min === 0 ? " is-now" : "");
      if (w.textContent !== text) w.textContent = text;
      if (w.className !== cls) w.className = cls;
      var legs = it.data.legs;
      els[i].setAttribute("aria-label", text + ", " + dur(legs[legs.length - 1].arr - legs[0].dep) + ", " + legs.map(function (l) { return MODE[l.line] + " " + l.code; }).join(", then "));
    }
  }

  function setStar(on) {
    var b = document.getElementById("resStar");
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.setAttribute("aria-label", on ? "Remove from favorites" : "Add to favorites");
    b.innerHTML = icon(on ? "fill:star" : "bold:star", 24);
  }
  function openResults(a, b, fromEl) {
    a = a.trim(); b = b.trim();
    if (!a || !b) { toast("Enter where from and where to"); return; }
    var route = matchRoute(a, b), slots = [];
    if (route) {
      route.services.forEach(function (s, i) {
        if (!TRIPS[route.id + ":" + i]) return;
        var k0 = Math.max(0, Math.ceil((clock - s.first) / s.every));
        for (var k = 0; k < 8; k++) slots.push({ idx: i, t: s.first + (k0 + k) * s.every });
      });
      slots.sort(function (x, y) { return x.t - y.t || x.idx - y.idx; });
    }
    res = { a: a, b: b, route: route, slots: slots, items: [], done: false, lastT: null, origin: fromEl };
    growResults(4);
    renderResults();
    resultsScroll.scrollTop = 0;
    setStar(!!starOn[norm(a) + ">" + norm(b)]);
    connectionEls.forEach(function (el) { el.inert = true; });
    resultsEl.inert = false;
    resultsEl.classList.add("is-open");
    document.getElementById("resBack").focus({ preventScroll: true });
  }
  function closeResults() {
    if (!res) return;
    if (current) closeTrip();
    closeSheet(true, "results");
    resultsEl.classList.remove("is-open");
    connectionEls.forEach(function (el) { el.inert = false; });
    var back = res.origin;
    res = null;
    if (back && back.isConnected) back.focus({ preventScroll: true });
  }

  document.getElementById("resBack").addEventListener("click", closeResults);
  document.getElementById("resMap").addEventListener("click", function () { toast("Map is not part of this concept yet"); });
  document.getElementById("resMore").addEventListener("click", function () { openSheet("results"); });
  document.getElementById("resStar").addEventListener("click", function () {
    if (!res) return;
    var key = norm(res.a) + ">" + norm(res.b);
    starOn[key] = !starOn[key];
    setStar(starOn[key]);
  });
  var resShare = document.getElementById("resShare");
  if (!navigator.share) resShare.hidden = true;
  resShare.addEventListener("click", function () {
    if (res) navigator.share({ title: "IDOS concept", text: res.a + " to " + res.b, url: location.href.split("?")[0] }).catch(function () {});
  });
  resultsScroll.addEventListener("click", function (e) {
    var later = e.target.closest("#resLater"), btn = e.target.closest(".result");
    if (later && res) {
      var n = res.items.length;
      growResults(3);
      if (res.items.length === n || res.items.length >= 12) res.done = true;
      renderResults(res.items.length > n ? n : null);
    } else if (btn && res) {
      var it = res.items[+btn.getAttribute("data-i")];
      if (it) openTrip({ routeId: it.routeId, t: it.t, data: it.data, day: it.day, key: it.key, title: res.a + " to " + res.b }, btn);
    }
  });

  pager.addEventListener("click", function (e) {
    var chipEl = e.target.closest(".chip"), head = e.target.closest(".card-head");
    if (chipEl && chipEl.dataset.key && !chipEl.classList.contains("is-leaving")) {
      var p = chipEl.dataset.key.split(":");
      showTrip(p[0], +p[1], +p[2], chipEl);
    } else if (head && ROUTES[head.dataset.route]) {
      var next = upcoming(ROUTES[head.dataset.route])[0];
      if (next) showTrip(head.dataset.route, next.idx, next.t, head);
    }
  });

  // Main tabs. Connection is the live screen, More is a list, Tickets is not part of this concept yet.
  // Whatever is hidden behind a page is made inert, so keyboard and screen readers cannot reach it.
  var elsewhere = document.getElementById("elsewhere"), morePage = document.getElementById("more");
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (tab) {
    tab.addEventListener("click", function () {
      var key = tab.getAttribute("data-tab");
      if (key === "connection" && (current || res)) { if (current) closeTrip(); else closeResults(); return; }   // the active tab pops back one page
      closeTrip(); closeResults();
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) { t.removeAttribute("aria-current"); });
      tab.setAttribute("aria-current", "page");
      elsewhere.hidden = key !== "tickets";
      morePage.hidden = key !== "more";
      connectionEls.forEach(function (el) { el.inert = key !== "connection"; });
      document.getElementById("elsewhereTitle").textContent = "Tickets";
    });
  });
})();
</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
</script>
</body>
</html>
